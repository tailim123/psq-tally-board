*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:#101828;background:#EEF3FB;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* ---------------- console top bar ---------------- */
.topbar{
  background:var(--dither);
  border-bottom:4px solid var(--ink);
  padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;height:0;
}
.mark{display:flex;flex-direction:column;line-height:1.2;gap:3px}
.mark .m1{font-family:var(--pix);font-size:8px;letter-spacing:.06em;color:#fff;text-shadow:2px 2px 0 var(--sky-3)}
.mark .m2{font-family:var(--pix);font-size:16px;color:var(--yellow);text-shadow:3px 3px 0 var(--navy)}
.mark .m3{font-size:12px;color:#fff;font-weight:600;text-shadow:1px 1px 0 var(--sky-3)}
.bar-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.btn{
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);
  border-radius:8px;padding:7px 13px;font-size:13px;font-weight:650;
  box-shadow:0 3px 0 var(--ink);
}
.btn:hover{background:var(--yellow)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow);}
.btn.primary:hover{background:#FFF480}
.livedot{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:#fff;font-weight:700;text-shadow:1px 1px 0 var(--sky-3)}
.livedot i{width:10px;height:10px;background:#2B3D5C;border:2px solid var(--ink);display:inline-block}
.livedot.on i{background:var(--grass)}
/* whether the board is really keeping anything — a storage that silently does
   nothing would be worse than none, so this never guesses */
.savedot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  color:#fff;text-shadow:1px 1px 0 var(--sky-3)}
.savedot i{width:10px;height:10px;border:2px solid var(--ink);display:inline-block;background:#2B3D5C}
.savedot.idb i{background:var(--grass)}
.savedot.local i{background:var(--gold)}
.savedot.none i{background:var(--red)}
.savedot.none span{color:#FFE2DC}

/* ---------------- podium strip ---------------- */
.podium-wrap{
  background:var(--sky-deep);
  background-image:repeating-conic-gradient(var(--sky-deep) 0% 25%, #33529A 0% 50%);
  background-size:16px 16px;
  border-bottom:4px solid var(--ink);padding:14px 18px 18px;
}
.podium-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.podium-head h2{font-family:var(--pix);font-size:11px;margin:0;color:var(--yellow);text-shadow:2px 2px 0 #16264A}
.basis{font-size:12px;color:#DCE7FA;font-weight:600}
.alert{
  margin-left:auto;background:var(--red);border:3px solid var(--ink);color:#fff;
  padding:5px 11px;border-radius:7px;font-size:12px;font-weight:650;box-shadow:0 3px 0 var(--ink);
}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{
  background:var(--cream);border:3px solid var(--ink);border-radius:10px;
  box-shadow:0 4px 0 var(--ink);
  padding:11px 14px;display:flex;gap:14px;align-items:center;min-height:84px;
}

.qstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;

  opacity:.9;pointer-events:none;
}
.dsp>*{position:relative;z-index:1}

.dsp .head{
  display:flex;align-items:center;gap:calc(var(--u)*2);flex:0 0 auto;
  padding-bottom:calc(var(--u)*1.4);border-bottom:3px solid var(--d-navy);
}
.dsp .head::before{
  content:"";width:calc(var(--u)*22);height:calc(var(--u)*5);flex:0 0 auto;
  background:var(--logo) no-repeat left center/contain;
}
.dsp .head .ttl{
  font-family:var(--pix);font-size:calc(var(--u)*1.9);color:var(--d-yellow);
  text-shadow:3px 3px 0 var(--d-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dsp .head .whr{font-size:calc(var(--u)*1.5);color:#fff;font-weight:700;text-shadow:1px 1px 0 var(--sky-3);margin-top:calc(var(--u)*.5)}
.dsp .head .now{
  margin-left:auto;font-size:calc(var(--u)*1.3);color:var(--ink);font-weight:800;white-space:nowrap;
  background:var(--d-cream);border:3px solid var(--ink);border-radius:calc(var(--u)*.8);
  padding:calc(var(--u)*.6) calc(var(--u)*1.2);box-shadow:0 3px 0 var(--ink);
}
.dsp .body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding-top:calc(var(--u)*1.6)}

/* ---- running the deck ----
   The slide is the content. None of the board's chrome belongs over the RTC's
   artwork, so the sky, the skyline and the padding all stand down. */
.dsp.run{padding:0;background:#000;display:block;position:relative}
.dsp.run::before,.dsp.run::after{display:none}
.dsp.run>*{position:absolute}
.dsp .slideimg,.dsp .slidevid{
  inset:0;width:100%;height:100%;object-fit:contain;display:block;
  z-index:0;background:#000;
}
/* a preliminary played from a file — full-bleed, with one way back */
.dsp .medback{z-index:2;bottom:calc(var(--u)*3);left:50%;transform:translateX(-50%)}
/* the clock rides in a corner, legible against any slide the RTC sends */
.dsp .clock{
  z-index:2;top:calc(var(--u)*2);right:calc(var(--u)*2);min-width:calc(var(--u)*13);
  text-align:center;font-family:var(--pix);font-size:calc(var(--u)*5);line-height:1;
  color:var(--ink);background:var(--d-yellow);border:5px solid var(--ink);
  border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.4) calc(var(--u)*1.6) calc(var(--u)*1);
  box-shadow:0 6px 0 var(--ink);
}
.dsp .clock em{
  display:block;font-family:var(--font);font-style:normal;font-weight:800;
  font-size:calc(var(--u)*1.1);letter-spacing:.08em;margin-top:calc(var(--u)*.8);
  color:var(--d-olive);text-transform:uppercase;
}
.dsp .clock.low{background:var(--d-red);color:#fff}
.dsp .clock.low em{color:#FFD9D2}
.dsp .clock.done{background:#C9D9F5;color:#2C4A8F}
.dsp .clock.done em{color:#2C4A8F}
.dsp .timeup{
  z-index:3;left:0;right:0;bottom:0;
  text-align:center;font-family:var(--pix);font-size:calc(var(--u)*5);line-height:1.2;
  color:#fff;background:rgba(208,52,28,.95);border-top:6px solid var(--ink);
  padding:calc(var(--u)*1.6) 0 calc(var(--u)*1.8);
  text-shadow:4px 4px 0 rgba(0,0,0,.45);letter-spacing:.06em;
}

/* ---- title card ---- */
.dsp .hero{text-align:center}
.dsp .hero .logo{height:calc(var(--u)*6.2);background:var(--logo) no-repeat center/contain;margin-bottom:calc(var(--u)*2)}
.dsp .hero .kick{
  font-size:calc(var(--u)*2.1);color:#fff;font-weight:700;text-shadow:2px 2px 0 var(--sky-3);
}
.dsp .hero h1{
  margin:calc(var(--u)*2.2) 0 calc(var(--u)*1.4);font-family:var(--pix);
  font-size:calc(var(--u)*4.6);line-height:1.5;color:var(--d-yellow);
  text-shadow:5px 5px 0 var(--d-navy), 9px 9px 0 rgba(32,51,87,.35);
}
.dsp .hero .sub{font-size:calc(var(--u)*2.2);color:#fff;font-weight:750;text-shadow:2px 2px 0 var(--sky-3)}
.dsp .hero .std{
  display:inline-block;margin-top:calc(var(--u)*2.6);font-family:var(--pix);
  font-size:calc(var(--u)*1.6);background:var(--d-yellow);border:4px solid var(--ink);
  border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.4) calc(var(--u)*3);
  box-shadow:0 6px 0 var(--ink);
}

.dsp .hero .venue{
  margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*1.6);color:#fff;font-weight:700;
  text-shadow:1px 1px 0 var(--sky-3);
}

/* the emcee and the Quizmaster on the title card, where the chips do not fit */
.dsp .hero .hostline{
  margin-top:calc(var(--u)*1.8);font-size:calc(var(--u)*1.5);color:#fff;font-weight:650;
  text-shadow:1px 1px 0 var(--sky-3);
}
.dsp .hero .hostline b{font-weight:850}

/* ---- the programme ----
   The printed programme read back: the two parts side by side, in order, with
   the segment that is on marked and the ones behind it ticked off. */
.dsp .pgm{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*44),1fr));
  gap:calc(var(--u)*1.6) calc(var(--u)*2.2);width:100%;align-items:start;
}
.dsp .pgm .part{display:flex;flex-direction:column;gap:calc(var(--u)*.7);min-width:0}
.dsp .pgm .phead{
  align-self:flex-start;font-family:var(--pix);font-size:calc(var(--u)*1.3);line-height:1;
  color:var(--ink);background:var(--d-yellow);border:3px solid var(--ink);
  border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.8) calc(var(--u)*1.4);
  box-shadow:0 3px 0 var(--ink);margin-bottom:calc(var(--u)*.4);
}
.dsp .pline{
  display:flex;align-items:center;gap:calc(var(--u)*1.4);min-width:0;
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.8);
  padding:calc(var(--u)*.7) calc(var(--u)*1.3);box-shadow:0 3px 0 var(--ink);
}
.dsp .pline .pt{min-width:0;flex:1 1 auto}
.dsp .pline .pt b{
  display:block;font-size:calc(var(--u)*1.5);font-weight:800;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;
}
.dsp .pline .pit{
  display:block;font-size:calc(var(--u)*1.2);color:var(--d-grass2);font-weight:700;
  line-height:1.25;margin-top:calc(var(--u)*.2);
}
.dsp .pline .pw{flex:0 0 auto;text-align:right;max-width:45%;min-width:0}
.dsp .pline .pw b{
  display:block;font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dsp .pline .pw span{
  display:block;font-size:calc(var(--u)*1.1);color:var(--d-olive);font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* the one that is on — the audience is told where we are, not left to count */
.dsp .pline.now{
  background:var(--d-yellow);border-width:4px;
  box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1) 0 0 var(--d-grass);
}
.dsp .pline.done{opacity:.6}
.dsp .pline.done .pt b::before{
  content:"\2713\00a0";color:var(--d-grass2);font-weight:800;
}

/* the emcee and the Quizmaster, at the foot of the programme and of the title card */
.dsp .hosts{
  flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;
  gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*2);
}
.dsp .hosts .host{
  background:var(--d-cream2);border:3px solid var(--ink);border-radius:calc(var(--u)*.8);
  padding:calc(var(--u)*.7) calc(var(--u)*1.6);box-shadow:0 3px 0 var(--ink);text-align:center;
}
/* under the programme they sit at the foot of the screen, as they do in print */
.dsp .body > .hosts{margin-top:auto;padding-top:calc(var(--u)*1.4)}
.dsp .hosts .host b{display:block;font-size:calc(var(--u)*1.4);font-weight:800;line-height:1.2}
.dsp .hosts .host span{
  display:block;font-family:var(--pix);font-size:calc(var(--u)*.95);color:var(--d-olive);
  margin-top:calc(var(--u)*.5);
}

/* ---- one segment, full screen ----
   A segment nobody is named for is a heading: the title, and whatever runs
   under it. Named a speaker, it becomes the card the coaches and judges get. */
.dsp .seg{text-align:center;margin:auto 0}   /* centred against the pager's own auto margin */
.dsp .seg .segt{
  font-family:var(--pix);font-size:calc(var(--u)*3.6);line-height:1.5;color:var(--d-yellow);
  text-shadow:4px 4px 0 var(--d-navy), 8px 8px 0 rgba(32,51,87,.3);
}
.dsp .seg .segby{
  margin-top:calc(var(--u)*2);font-size:calc(var(--u)*2.2);color:#fff;font-weight:750;
  text-shadow:2px 2px 0 var(--sky-3);
}
.dsp .seg .segitems{
  display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.6);
  margin-top:calc(var(--u)*3.4);
}
.dsp .seg .segitem{
  background:#FFFFFF;border:4px solid var(--ink);border-radius:calc(var(--u)*1);
  box-shadow:0 5px 0 var(--ink);padding:calc(var(--u)*1.4) calc(var(--u)*2.6);
  font-size:calc(var(--u)*2);font-weight:800;line-height:1.2;
  font-family:inherit;color:inherit;cursor:pointer;   /* it is a button now */
}
.dsp .seg .segitem:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.dsp .seg .orgline{
  display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);
  margin-top:calc(var(--u)*2.4);
}
.dsp .seg .orgline span{font-size:calc(var(--u)*1.7);color:#fff;font-weight:750;text-shadow:1px 1px 0 var(--sky-3)}
.dsp .seg .orgmark{
  height:calc(var(--u)*4.4);max-width:calc(var(--u)*7);object-fit:contain;
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.5);
  padding:calc(var(--u)*.35);
}

/* ---- the health break ---- */
.dsp .brk{text-align:center}
.dsp .brk .kick{
  font-family:var(--pix);font-size:calc(var(--u)*2.6);color:var(--d-yellow);
  text-shadow:4px 4px 0 var(--d-navy);letter-spacing:.04em;
}
.dsp .brk .bclock{
  display:inline-block;margin-top:calc(var(--u)*3);font-family:var(--pix);
  font-size:calc(var(--u)*11);line-height:1;color:var(--ink);background:var(--d-yellow);
  border:6px solid var(--ink);border-radius:calc(var(--u)*1.6);
  padding:calc(var(--u)*2.4) calc(var(--u)*4) calc(var(--u)*1.8);
  box-shadow:0 8px 0 var(--ink);
}
.dsp .brk .bclock.soon{background:var(--d-red);color:#fff}
.dsp .brk.over .bclock{background:#C9D9F5;color:var(--sky-deep)}
.dsp .brk .bsub{
  margin-top:calc(var(--u)*3);font-size:calc(var(--u)*2.2);color:#fff;font-weight:750;
  text-shadow:2px 2px 0 var(--sky-3);
}

/* ---- on-screen option button (title card, mechanics) ---- */
.dsp .sbtn{
  display:inline-block;font-family:var(--pix);font-size:calc(var(--u)*1.4);line-height:1.3;
  color:var(--ink);background:var(--d-cream);border:4px solid var(--ink);
  border-radius:calc(var(--u)*.9);padding:calc(var(--u)*1.2) calc(var(--u)*2.2);
  box-shadow:0 5px 0 var(--ink);cursor:pointer;
}
.dsp .sbtn:hover{background:var(--d-cream2)}
.dsp .sbtn:active{transform:translateY(5px);box-shadow:0 0 0}
/* the title card's options sit on one line, with their note under both */
.dsp .opt{
  margin-top:calc(var(--u)*2.2);display:flex;flex-wrap:wrap;
  justify-content:center;gap:calc(var(--u)*1.4);
}
.dsp .opt .opthint{
  flex:0 0 100%;margin-top:calc(var(--u)*.4);font-size:calc(var(--u)*1.4);
  color:#fff;font-weight:700;text-shadow:1px 1px 0 var(--sky-3);
}
/* the mechanics footer holds the back button and the screen pager on one line */
.dsp .mfoot{
  flex:0 0 auto;margin-top:auto;display:flex;align-items:center;
  justify-content:space-between;gap:calc(var(--u)*2);padding-top:calc(var(--u)*1.6);
}
.dsp .mfoot .pager{margin-top:0;padding-top:0}

/* ---- contest mechanics ---- */
.dsp .mrds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*1.6);width:100%}
.dsp .mrd{
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.9);
  box-shadow:0 3px 0 var(--ink);padding:calc(var(--u)*1.6) calc(var(--u)*1.8);
  display:flex;flex-direction:column;gap:calc(var(--u)*.5);min-width:0;
}
.dsp .mrd b{font-family:var(--pix);font-size:calc(var(--u)*1.5);color:var(--d-olive);line-height:1.4}
.dsp .mrd span{font-size:calc(var(--u)*1.5);font-weight:700;color:#3A4657;line-height:1.3}
.dsp .mrd .max{font-family:var(--pix);font-size:calc(var(--u)*2.4);margin-top:calc(var(--u)*.8)}
.dsp .mrd .max em{
  font-family:var(--font);font-style:normal;font-size:calc(var(--u)*1.2);font-weight:700;
  color:var(--d-olive);margin-left:calc(var(--u)*.8);
}
.dsp .mlead{
  font-size:calc(var(--u)*1.5);font-weight:700;color:#fff;text-shadow:1px 1px 0 var(--sky-3);
  margin-bottom:calc(var(--u)*1.4);
}
.dsp .mrl{
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.9);
  box-shadow:0 3px 0 var(--ink);padding:calc(var(--u)*1.35) calc(var(--u)*2);
  margin-bottom:calc(var(--u)*1.25);
}
.dsp .mrds + .mrl{margin-top:calc(var(--u)*1.6)}
.dsp .mrl b{
  display:block;font-family:var(--pix);font-size:calc(var(--u)*1.45);color:var(--d-olive);
  margin-bottom:calc(var(--u)*.8);line-height:1.4;
}
.dsp .mrl span{display:block;font-size:calc(var(--u)*1.55);font-weight:650;line-height:1.4;color:#101828}
.dsp .mrl ul,.dsp .mrl ol{margin:0;padding:0;list-style:none;
  display:flex;flex-direction:column;gap:calc(var(--u)*.75)}
.dsp .mrl li{
  position:relative;padding-left:calc(var(--u)*2.6);
  font-size:calc(var(--u)*1.55);font-weight:650;line-height:1.35;color:#101828;
}
/* square pixel bullet, and numbered steps for the tie-break order */
.dsp .mrl ul li::before{
  content:"";position:absolute;left:0;top:calc(var(--u)*.55);
  width:calc(var(--u)*1);height:calc(var(--u)*1);background:var(--d-grass);
  border:2px solid var(--ink);
}
.dsp .mrl ol{counter-reset:mstep}
.dsp .mrl ol li{padding-left:calc(var(--u)*3.4)}
.dsp .mrl ol li::before{
  counter-increment:mstep;content:counter(mstep);position:absolute;left:0;top:calc(var(--u)*.15);
  font-family:var(--pix);font-size:calc(var(--u)*1.2);color:var(--d-olive);
}

/* ---- section heading ---- */
.dsp .sect{
  font-family:var(--pix);font-size:calc(var(--u)*1.7);color:var(--d-yellow);
  text-shadow:3px 3px 0 var(--d-navy);margin-bottom:calc(var(--u)*1.6);
}
.dsp .sect small{font-family:var(--font);font-size:calc(var(--u)*1.4);font-weight:700;color:#fff;text-shadow:1px 1px 0 var(--sky-3);margin-left:calc(var(--u)*1.4)}

/* the introduction's heading: the school's logo, then its name a size up from
   the other cues, with the line about the screen tucked under it */
.dsp .sect.schead{
  display:flex;align-items:center;gap:calc(var(--u)*1.6);min-width:0;
}
.dsp .schead .slogo{
  flex:0 0 auto;height:calc(var(--u)*6);width:auto;max-width:calc(var(--u)*9);
  object-fit:contain;background:#FFFFFF;border:3px solid var(--ink);
  border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.5);box-shadow:0 3px 0 var(--ink);
}
.dsp .schead .stxt{min-width:0}
.dsp .schead .sname{font-size:calc(var(--u)*2.3);line-height:1.25}
.dsp .schead .ssub{
  font-family:var(--font);font-size:calc(var(--u)*1.4);font-weight:700;color:#fff;
  text-shadow:1px 1px 0 var(--sky-3);margin-top:calc(var(--u)*.5);
}

/* ---- score lines ---- */
.dsp .grid{display:grid;gap:calc(var(--u)*.8) calc(var(--u)*1.6);
  grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;overflow:hidden;width:100%}
.dsp .line{
  display:grid;grid-template-columns:calc(var(--rh)*.8) minmax(0,1fr) auto;align-items:center;
  gap:calc(var(--u)*1.2);background:#FFFFFF;border:3px solid var(--ink);
  border-radius:calc(var(--u)*.9);padding:0 calc(var(--u)*1.4);min-width:0;overflow:hidden;
  box-shadow:0 3px 0 var(--ink);
}
.dsp .line .ix{font-family:var(--pix);font-size:calc(var(--rh)*.24);color:var(--d-olive);text-align:center}
.dsp .line .who{min-width:0}
.dsp .line .who b{display:block;font-size:calc(var(--rh)*.33);font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsp .line .who span{display:block;font-size:calc(var(--rh)*.21);color:var(--d-grass2);font-weight:650;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsp .line .val{font-family:var(--pix);font-size:calc(var(--rh)*.32);text-align:right;white-space:nowrap}
.dsp .line .val em{display:block;font-family:var(--font);font-size:calc(var(--rh)*.17);font-style:normal;
  color:var(--d-olive);font-weight:700;line-height:1.2;margin-top:calc(var(--rh)*.06)}
.dsp .line.r1{border-width:4px;box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1.2) 0 0 var(--d-yellow)}
.dsp .line.r2,.dsp .line.r3{background:#FFFFFF}
.dsp .line.r2{border-width:4px;box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1.2) 0 0 #A9B7C8}
.dsp .line.r3{border-width:4px;box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1.2) 0 0 #D7A06A}
.dsp .line.qual{border-width:4px;box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1.2) 0 0 var(--d-grass)}
.dsp .line.r1 .ix,.dsp .line.r2 .ix,.dsp .line.r3 .ix{color:#8A5E00}
.dsp .line.dead{opacity:.5}
/* eliminated at the Round 3 cut — dimmed, with a red edge and a struck-through name */
.dsp .line.gone{
  opacity:.62;background:#F1E4E1;
  box-shadow:0 3px 0 var(--ink), inset calc(var(--u)*1.2) 0 0 var(--d-red);border-width:4px;
}
.dsp .line.gone .who b{text-decoration:line-through;text-decoration-thickness:3px}
.dsp .line.gone .val{color:#8E2413}
.dsp .line.gone .val em{color:#8E2413}

/* ---- portraits ---- */
.dsp .por{
  --crest-opacity:.45;
  width:100%;aspect-ratio:3/4;background:#DCE7FA;border:4px solid var(--ink);
  border-radius:calc(var(--u)*.8);overflow:hidden;box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;position:relative;
}
/* the school crest, washed back behind the portrait. Everything in the frame is
   layered explicitly so a photograph always lands on top of it. */
.dsp .por .crest{
  position:absolute;inset:10%;z-index:0;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  opacity:var(--crest-opacity);pointer-events:none;
}
.dsp .por img{
  width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto;
  position:relative;z-index:1;
}
.dsp .por .noimg{
  font-family:var(--pix);font-size:calc(var(--u)*4);color:#7E9AD4;
  position:relative;z-index:1;
}
/* against a crest the bare number would fight the artwork, so it steps back and
   sits on a disc of the frame's own colour */
.dsp .por .crest ~ .noimg{
  color:#5A7CB8;background:rgba(220,231,250,.82);
  border-radius:2em;min-width:1.9em;height:1.9em;line-height:1.9em;
  padding:0 .35em;text-align:center;
}

/* ---- introduce the contestants ----
   Cards are sized by the height left on the screen, never by their width: the
   portrait takes what the name and school do not, and keeps its 3:4 frame from
   that height. Six across two rows or one alone then fit the same way. */
.dsp .intro{
  --cardw:calc(var(--u)*30);                   /* one tile, whatever else is on the screen */
  display:grid;gap:calc(var(--u)*1.6);width:100%;justify-content:center;
  flex:1 1 auto;min-height:0;grid-auto-rows:minmax(0,1fr);
}
.dsp .icard{
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.9);
  box-shadow:0 3px 0 var(--ink);padding:calc(var(--u)*1.1);min-width:0;min-height:0;
  text-align:center;display:flex;flex-direction:column;gap:calc(var(--u)*.8);
  max-width:var(--cardw);                      /* the track already caps it; this is the belt */
}
/* a single portrait sits in the middle of the screen, not at the left edge:
   the grid track is full width, so the card needs its own width to centre in it */
.dsp .intro.solo .icard{justify-self:center;width:calc(var(--u)*70);max-width:100%}
.dsp .icard .por{
  flex:1 1 auto;min-height:0;width:auto;height:auto;max-width:100%;aspect-ratio:3/4;margin:0 auto;
}
.dsp .icard .itxt{flex:0 0 auto;min-width:0}
.dsp .icard .num{font-family:var(--pix);font-size:calc(var(--u)*1.1);color:var(--d-olive)}
.dsp .icard .who{
  font-size:calc(var(--u)*1.7);font-weight:850;line-height:1.2;margin-top:calc(var(--u)*.4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dsp .icard .sch{
  font-size:calc(var(--u)*1.25);color:var(--d-grass2);font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* an organisation on a card — its logo small and sharp beside the name, where
   the crest behind the portrait is large and washed back */
.dsp .icard .orgline{
  display:flex;align-items:center;justify-content:center;
  gap:calc(var(--u)*.8);margin-top:calc(var(--u)*.7);min-width:0;
}
.dsp .icard .orgmark{
  flex:0 0 auto;height:calc(var(--u)*3);width:auto;max-width:calc(var(--u)*4.5);
  object-fit:contain;background:#FFFFFF;border:2px solid var(--ink);
  border-radius:calc(var(--u)*.4);padding:calc(var(--u)*.25);
}
.dsp .icard .orgline span{
  font-size:calc(var(--u)*1.25);color:var(--d-grass2);font-weight:700;line-height:1.25;
  min-width:0;overflow:hidden;text-overflow:ellipsis;
}

/* one contestant on the screen — the formal, one-at-a-time introduction */
.dsp .intro.solo .icard{
  flex-direction:row;align-items:center;text-align:left;
  gap:calc(var(--u)*3.5);padding:calc(var(--u)*2.4);
}
.dsp .intro.solo .por{flex:0 0 auto;height:100%;width:auto;margin:0}
.dsp .intro.solo .itxt{flex:1 1 auto}
.dsp .intro.solo .num{font-size:calc(var(--u)*1.8)}
.dsp .intro.solo .who{font-size:calc(var(--u)*4.4);white-space:normal;margin-top:calc(var(--u)*1.2)}
.dsp .intro.solo .sch{
  font-size:calc(var(--u)*2.2);white-space:normal;margin-top:calc(var(--u)*1);line-height:1.3;
}
.dsp .intro.solo .orgline{justify-content:flex-start;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.4)}
.dsp .intro.solo .orgmark{height:calc(var(--u)*5.2);max-width:calc(var(--u)*8)}
.dsp .intro.solo .orgline span{font-size:calc(var(--u)*1.8);white-space:normal;overflow:visible}

/* ---- top 3 reveal ----
   The cards share one set of row tracks rather than each stacking its own, so
   the place label, the portrait, the name, the school and the points sit on the
   same lines right across the screen. A name or a school that wraps to two
   lines grows that row on every card instead of sliding one card's portrait
   past its neighbour's. Row gap is zero because the cards span every row: the
   space between the lines inside a card is set by their own margins. */
.dsp .rev{
  display:grid;grid-template-columns:repeat(3,1fr);
  /* label / portrait / name / school / tie-break note. The portrait's row is the
     flexible one: the text rows take the height they need — a name and a school
     that both wrap take a lot — and the portraits share out whatever is left,
     equally on both cards. Fixed portrait heights looked right on a wide screen
     and ran the cards off the bottom of a 1280x720 one. */
  grid-template-rows:auto minmax(0,1fr) auto auto auto;
  column-gap:calc(var(--u)*2.4);row-gap:0;align-items:stretch;
  flex:1 1 auto;min-height:0;
}
/* the champion is not on this screen, so the two placers get the room */
.dsp .rev.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:calc(var(--u)*92);margin:0 auto;width:100%}
/* The frame takes the height of its row and keeps its 3:4 from that, so it is
   never the thing that pushes a card off the screen. The cap stops it growing
   into the breakdown beside it when the names are short and the room is wide. */
.dsp .rev .por{
  height:100%;width:auto;max-height:calc(var(--u)*26);flex:0 0 auto;margin:0;
}
/* the portrait and the round-by-round breakdown, side by side. Both placer
   cards are laid out the same way round, so the portraits, the round rows, the
   names and the schools each sit on one line right across the screen. */
.dsp .card .mid,.dsp .champ .mid{
  display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;
  gap:calc(var(--u)*2);margin-top:calc(var(--u)*1.4);
}

/* ---- the round-by-round breakdown ----
   The placing is decided on the total, so the total is the big figure and the
   three rounds above it say where it came from. When two finishers land on the
   same total this is the screen that shows the hall which round separated them,
   without anybody having to explain it. */
.dsp .brk{
  flex:0 1 auto;min-width:0;text-align:left;
  display:flex;flex-direction:column;gap:calc(var(--u)*.7);
}
.dsp .brk .brow{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:calc(var(--u)*1.6);white-space:nowrap;
}
.dsp .brk .brow span{font-size:calc(var(--u)*1.9);font-weight:700;color:var(--d-navy)}
/* two digits is the most any figure runs to — Round 3 tops out at 20, the total at 40 */
.dsp .brk .brow b{
  font-family:var(--pix);font-size:calc(var(--u)*2.4);
  min-width:2.2em;text-align:right;
}
.dsp .brk .tot{
  border-top:3px solid var(--ink);
  margin-top:calc(var(--u)*.3);padding-top:calc(var(--u)*.9);
}
.dsp .brk .tot span{
  font-family:var(--pix);font-size:calc(var(--u)*1.5);color:var(--d-olive);
  letter-spacing:.1em;
}
.dsp .brk .tot b{font-size:calc(var(--u)*3.2)}
/* only rendered when somebody else finished on the same total */
.dsp .tie{
  font-size:calc(var(--u)*1.5);font-weight:700;font-style:italic;color:var(--d-olive);
  margin-top:calc(var(--u)*.9);
}
.dsp .card{
  background:#FFFFFF;border:5px solid var(--ink);border-radius:calc(var(--u)*1.6);
  box-shadow:0 7px 0 var(--ink);
  padding:calc(var(--u)*3) calc(var(--u)*2.6);text-align:center;
  display:grid;grid-row:1/-1;grid-template-rows:subgrid;
}
.dsp .card .pl{font-family:var(--pix);font-size:calc(var(--u)*1.9);color:var(--d-olive)}
.dsp .card .who{font-size:calc(var(--u)*3.4);font-weight:850;margin:calc(var(--u)*1.8) 0 calc(var(--u)*.7);line-height:1.15}
.dsp .card .sch{font-size:calc(var(--u)*2);color:var(--d-grass2);font-weight:700;line-height:1.3}
.dsp .card.c1{box-shadow:0 7px 0 var(--ink), inset 0 calc(var(--u)*1.4) 0 var(--d-yellow)}
.dsp .card.hidden{background:rgba(255,255,255,.16);border-style:dashed;border-color:#2C4A8F;box-shadow:none}
.dsp .card.hidden .pl{color:#DCE7FA}
.dsp .card.hidden .who{font-family:var(--pix);color:#9FBDF2;font-size:calc(var(--u)*12);margin:0;
  grid-row:2/-1;align-self:center}
.dsp .pop{animation:dpop .45s steps(4,end) both}
@keyframes dpop{from{opacity:0;transform:scale(.86) translateY(calc(var(--u)*2))}to{opacity:1;transform:none}}

/* ---- champion ---- */
/* The portrait is sized by the height left over, not by a width picked in
   advance: it was coming out a quarter of the width of the name beside it. The
   introduction card already works this way — the text takes what it needs and
   the frame keeps its 3:4 from whatever remains. */
.dsp .champ{text-align:center;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
/* the portrait has to leave room for the name, school and points below it */
.dsp .champ .por{
  height:100%;width:auto;flex:0 0 auto;margin:0;
  border-width:5px;box-shadow:0 6px 0 var(--ink), 0 0 0 calc(var(--u)*.8) var(--d-yellow);
}
.dsp .champ .mid{flex:1 1 auto;min-height:0;margin-top:calc(var(--u)*1.8);gap:calc(var(--u)*3.5)}
.dsp .champ .pl{font-family:var(--pix);font-size:calc(var(--u)*1.7);color:var(--d-yellow);text-shadow:3px 3px 0 var(--d-navy)}
.dsp .champ .who{font-size:calc(var(--u)*5.4);font-weight:850;line-height:1.05;margin:calc(var(--u)*1.8) 0 calc(var(--u)*1);color:#fff;text-shadow:4px 4px 0 var(--d-navy)}
.dsp .champ .sch{font-size:calc(var(--u)*2.6);color:#fff;font-weight:700;text-shadow:2px 2px 0 var(--sky-3)}
/* the champion's breakdown stands on a slab of its own — the card behind it is
   the sky, not a white tile, so the rows need their own ground to read against */
.dsp .champ .brk{
  background:#FFFFFF;border:5px solid var(--ink);border-radius:calc(var(--u)*1.2);
  box-shadow:0 6px 0 var(--ink);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);
  gap:calc(var(--u)*1);
}
.dsp .champ .brk .brow span{font-size:calc(var(--u)*1.9)}
.dsp .champ .brk .brow b{font-size:calc(var(--u)*2.4)}
.dsp .champ .brk .tot{border-top-width:4px}
.dsp .champ .brk .tot span{font-size:calc(var(--u)*1.5)}
.dsp .champ .brk .tot b{font-size:calc(var(--u)*3.6)}
.dsp .champ .tie{color:var(--d-cream);text-shadow:2px 2px 0 var(--d-navy)}

/* ---- sudden death ---- */
.dsp .sdrow{
  display:grid;grid-template-columns:1fr auto auto;gap:calc(var(--u)*2);align-items:center;
  background:#FFFFFF;border:3px solid var(--ink);border-radius:calc(var(--u)*.9);
  padding:calc(var(--u)*1.2) calc(var(--u)*2);margin-bottom:calc(var(--u)*1.2);box-shadow:0 3px 0 var(--ink);
}
.dsp .sdrow .marks{display:flex;gap:calc(var(--u)*.8)}
.dsp .sdrow .mk{
  width:calc(var(--u)*4);height:calc(var(--u)*4);border:3px solid var(--ink);border-radius:calc(var(--u)*.5);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*2);font-weight:800;color:#C3CEDB;
}
.dsp .sdrow .mk.c{background:var(--d-grass);color:var(--ink)}
.dsp .sdrow .mk.w{background:var(--d-red);color:#fff}
.dsp .sdrow .stat{font-size:calc(var(--u)*1.5);font-weight:800;min-width:calc(var(--u)*15);text-align:right}
.dsp .sdrow .stat.out{color:#8E2413}
.dsp .sdrow .stat.in{color:#3C5A16}

.dsp .pager{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);
  margin-top:auto;padding-top:calc(var(--u)*1.4);
}
.dsp .pager .pg{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--pix);font-size:calc(var(--u)*1.6);line-height:1;
  background:var(--d-yellow);border:4px solid var(--ink);border-radius:calc(var(--u)*.9);
  padding:calc(var(--u)*1) calc(var(--u)*2);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink);
}
.dsp .pager .pg:hover{background:#FFF7A8}
.dsp .pager .pg:active{transform:translateY(4px);box-shadow:0 0 0}
.dsp .pager .pg:disabled{background:#C9D9F5;border-color:#2C4A8F;color:#7E9AD4;box-shadow:none;cursor:default}
.dsp .pager .tri{width:0;height:0;
  border-top:calc(var(--u)*1.2) solid transparent;border-bottom:calc(var(--u)*1.2) solid transparent}
.dsp .pager .prev .tri{border-right:calc(var(--u)*1.7) solid currentColor}
.dsp .pager .next .tri{border-left:calc(var(--u)*1.7) solid currentColor}
.dsp .pager .pgl{
  font-family:var(--pix);font-size:calc(var(--u)*1.3);color:#fff;text-shadow:2px 2px 0 var(--sky-3);
}
.dsp .foot{flex:0 0 auto;padding-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.3);
  color:#fff;font-weight:700;text-shadow:1px 1px 0 var(--sky-3);display:flex;gap:calc(var(--u)*2)}
.dsp .none{text-align:center;color:#fff;font-size:calc(var(--u)*2);font-weight:750;text-shadow:2px 2px 0 var(--sky-3)}


/* ============ movement ============
   Super Mario is the reference, so the motion is pixel-stepped rather than
   smooth — but the audience is here to read names and scores off a projector,
   so nothing under a line of text moves more than a couple of pixels, and
   nothing that moves repeats faster than about a second and a half. Entrances
   play once and settle. base.css turns all of it off under
   prefers-reduced-motion. */

/* the sky drifts, as it does behind every overworld. The tile is 300px, so the
   loop is seamless; 90s makes it barely perceptible and never distracting. */
@keyframes drift{ to{ background-position:-300px 0; } }
.dsp::before{ animation:drift 90s linear infinite; }

/* a heading arrives the way Mario lands: up, overshoot, down. Four steps, so it
   reads as sprite animation rather than a fade. Transform only, and no fill —
   an element that never gets to animate is simply in its final place, never
   stuck invisible on a projector. Only on the ceremony screens: a score heading
   must not replay every time a box is ticked. */
@keyframes land{
  0%  { transform:translateY(-14%) }
  55% { transform:translateY(6%) }
  100%{ transform:none }
}
.dsp .hero h1,
.dsp .schead,
.dsp .seg .segt,
.dsp .pgm .phead{ animation:land .42s steps(4,end); }

/* cards rise into place like a block hit from below */
@keyframes riseup{
  0%  { transform:translateY(18%) }
  70% { transform:translateY(-3%) }
  100%{ transform:none }
}
.dsp .icard,
.dsp .seg .segitem{ animation:riseup .38s steps(4,end); }

/* the segment that is on bobs on the spot — the question block waiting to be
   hit. Two pixels, once every 1.6s: the eye finds it, the reader is not chased
   down the page by it. */
@keyframes bob{ to{ transform:translateY(-2px) } }
.dsp .pline.now{ animation:bob 1.6s steps(2,end) infinite alternate; }

/* the champion's frame glints, the way a coin does. Colour only — the portrait
   and the name hold still. */
@keyframes glint{
  0%,100%{ box-shadow:0 6px 0 var(--ink), 0 0 0 calc(var(--u)*.8) var(--d-yellow) }
  50%    { box-shadow:0 6px 0 var(--ink), 0 0 0 calc(var(--u)*.8) #FFFFFF }
}
.dsp .champ .por{ animation:glint 1.8s steps(2,end) infinite; }

</style>
</head>
<body>

<div class="topbar">
  <div class="mark">
    <span class="m1">Philippine Statistics Quiz</span>
    <span class="m2" id="markTitle"></span>
    <span class="m3" id="markSub"></span>
  </div>
  <div class="bar-actions">
    <span class="savedot" id="saveDot"></span>
    <span class="livedot" id="liveDot"><i></i><span id="liveTxt">Display closed</span></span>
    <button class="btn" id="btnTitle">Back to title</button>
    <button class="btn" id="btnPreview">Preview</button>
    <button class="btn primary" id="btnDisplay">Open display screen</button>
    <button class="btn" id="btnForm1">Export Form 1</button>
    <button class="btn" id="btnOpen">Open session</button>
    <button class="btn" id="btnSave">Save session</button>
    <input type="file" id="fileIn" accept=".json" style="display:none">
    <input type="file" id="photoIn" accept="image/*" style="display:none">
    <input type="file" id="slidesIn" accept="image/*" multiple style="display:none">
    <input type="file" id="deckIn" accept=".json" style="display:none">
  </div>
</div>

<div class="restorebar" id="restoreBar"></div>

<div class="podium-wrap">
  <div class="podium-head">
    <h2>Top 3</h2>
    <span class="basis" id="basisLabel"></span>
    <span class="alert" id="alertFlag" style="display:none"></span>
  </div>
  <div class="podium" id="podium"></div>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<div class="preview" id="preview">
  <div class="pv-bar">
    <span>Preview of the audience screen — this is exactly what the second monitor shows.</span>
    <button class="btn" id="btnTitle2" style="margin-left:auto">Back to title</button>
    <button class="btn" id="btnClosePreview">Close preview</button>
  </div>
  <div class="frame"><div id="previewRoot" style="height:100%"></div></div>
</div>

<div class="modal" id="sdModal"></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var QN = 10;
  var PTS = {r1:1, r2:1, r3:2};
  var ADV = 8;   // Rounds 1&2 cumulative that qualifies for Round 3 — Section C.3
  var LABEL = {r1:"Round 1", r2:"Round 2", r3:"Round 3"};

  function blankC(no){
    return {no:no, name:"", school:"", photo:null, coachId:null,
            r1:new Array(QN).fill(false),
            r2:new Array(QN).fill(false),
            r3:new Array(QN).fill(false),
            sd:new Array(5).fill(null)};
  }

  var state = {
    meta:{edition:"30th Philippine Statistics Quiz",
          level:"Provincial Elimination",
          place:"Marinduque",
          venue:"Governor’s Hall, Capitol Compound, Bangbangalon, Boac, Marinduque",
          date:"24 September 2026",
          sdCount:5},
    cut:null,          // once the Round 3 cut is announced, the frozen list of contestant numbers
    sdAck:[],          // tie-breaks the operator has seen resolved and cleared away
    coaches:[],        // {id, name, school, photo} — one entry per registered coach
    schools:[],        // {name, logo} — only the schools a logo has been added for
    judges:[],         // {name, role, office, org, photo} — the Board of Judges, in introduction order
    /* the printed programme, in the order it runs. Seeded by prog() rather than
       here: in development the parts are separate scripts, so the default is not
       defined yet when this object is built. */
    programme:null,    // [{id, part, title, items, name, office, org, photo, cue, round, done}]
    progNow:null,      // the id of the segment that is on, once one has been taken
    hosts:null,        // [{role, name, org, photo}] — the emcee and the Quizmaster
    deck:{name:"", slides:[]},   // the RTC's slides as pictures, and what each one is
    contestants:[]
  };
  for(var i=1;i<=22;i++) state.contestants.push(blankC(i));

  var tab = "roster";
  // val: "total" = running total across the rounds, "round" = this round's score alone
  var disp = {cue:"standby", round:"r1", reveal:0, page:0, cols:0, val:"total"};
  var sortBy = "no";   // "no" = contestant number, "score" = running total
  var perPage = 8;
  var introPer = 6;    // portraits per page on the Introduce contestants screen
  var winRef = null, popFlag = false;

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

  /* ===================== scoring ===================== */
  function named(){ return state.contestants.filter(function(c){ return c.name.trim()!==""; }); }
  function rt(c,k){ var n=0; for(var i=0;i<QN;i++){ if(c[k][i]) n++; } return n*PTS[k]; }
  function cum12(c){ return rt(c,"r1")+rt(c,"r2"); }
  function grand(c){ return cum12(c)+rt(c,"r3"); }
  function hasMarks(k){ return state.contestants.some(function(c){ return c[k].some(Boolean); }); }
  function hasSd(){ return state.contestants.some(function(c){ return c.sd.some(function(v){return v;}); }); }

  // what the Section C.3 rule says about the scores as they stand right now
  function liveQualifiers(){
    var list = named();
    if(!list.length) return [];
    var ge8 = list.filter(function(c){ return cum12(c)>=ADV; });
    if(ge8.length>=5) return ge8;
    var sorted = list.slice().sort(function(a,b){ return cum12(b)-cum12(a); });
    if(sorted.length<=5) return sorted;
    var cut = cum12(sorted[4]);
    return sorted.filter(function(c){ return cum12(c)>=cut; });
  }
  // once the Quizmaster has announced the cut it is frozen, so a later correction
  // to a Round 1 or 2 mark cannot quietly change who is playing Round 3
  function qualifiers(){
    if(!state.cut) return liveQualifiers();
    return named().filter(function(c){ return state.cut.indexOf(c.no)>=0; });
  }
  function isCut(){ return !!state.cut; }
  // an announced cut that no longer matches the rule — the operator corrected a mark
  function cutDrift(){
    if(!state.cut) return null;
    var now = liveQualifiers().map(function(c){ return c.no; });
    var added = now.filter(function(n){ return state.cut.indexOf(n)<0; });
    var dropped = state.cut.filter(function(n){ return now.indexOf(n)<0; });
    return (added.length || dropped.length) ? {added:added, dropped:dropped} : null;
  }
  function nameOf(no){
    var c = state.contestants.filter(function(x){ return x.no===no; })[0];
    return c && c.name ? c.name : ("No. "+no);
  }

  function sdStreak(c){
    var n=0;
    for(var i=0;i<state.meta.sdCount;i++){
      if(c.sd[i]==="c") n++;
      else if(c.sd[i]==="w") return {n:n, alive:false, out:i+1};
      else break;
    }
    return {n:n, alive:true, out:0};
  }
  function sdKey(c){ var s=sdStreak(c); return s.n*2 + (s.alive?1:0); }
  function key(c){ return [grand(c), rt(c,"r1"), rt(c,"r2"), sdKey(c)]; }
  function cmpKey(a,b){
    var ka=key(a), kb=key(b);
    for(var i=0;i<ka.length;i++){ if(kb[i]!==ka[i]) return kb[i]-ka[i]; }
    return 0;
  }

  function stage(){
    if(hasMarks("r3")) return {fn:grand, label:"Cumulative, Rounds 1–3", short:"Rounds 1–3", s:"r3"};
    if(hasMarks("r2")) return {fn:cum12, label:"Cumulative, Rounds 1 & 2", short:"Rounds 1 & 2", s:"r2"};
    if(hasMarks("r1")) return {fn:function(c){return rt(c,"r1");}, label:"Round 1 scores", short:"Round 1", s:"r1"};
    return {fn:function(){return 0;}, label:"No scores tallied yet", short:"—", s:"none"};
  }
  function sameSpot(a,b,st){ return st.s==="r3" ? cmpKey(a,b)===0 : st.fn(a)===st.fn(b); }

  function standings(){
    var st = stage(), list = named().slice();
    if(st.s==="r3") list.sort(function(a,b){ var d=cmpKey(a,b); return d!==0?d:a.no-b.no; });
    else list.sort(function(a,b){ var d=st.fn(b)-st.fn(a); return d!==0?d:a.no-b.no; });
    var place=new Map(), same=new Map(), i=0;
    while(i<list.length){
      var j=i;
      while(j+1<list.length && sameSpot(list[j],list[j+1],st)) j++;
      for(var k=i;k<=j;k++){ place.set(list[k], i+1); same.set(list[k], j-i+1); }
      i=j+1;
    }
    return {rows:list, place:place, shared:same, stage:st};
  }

  // A tie-break group is defined by what was level *before* sudden death — the
  // three rounds and then Round 1 and Round 2. Grouping on the full key would
  // dissolve the group on the first tick, since that mark changes sdKey.
  function samePre(a,b){
    return grand(a)===grand(b) && rt(a,"r1")===rt(b,"r1") && rt(a,"r2")===rt(b,"r2");
  }
  function unresolved(){
    var s = standings();
    if(s.stage.s!=="r3") return null;
    var groups=[], seen=new Set();
    s.rows.forEach(function(c){
      if(seen.has(c)) return;
      var g = s.rows.filter(function(x){ return samePre(x,c); });
      if(g.length<2) return;
      var place = Math.min.apply(null, g.map(function(x){ return s.place.get(x); }));
      if(place>3) return;                       // only the top three need breaking
      g.forEach(function(x){ seen.add(x); });
      groups.push({place:place, members:g});
    });
    return groups.length ? groups : null;
  }

  // where a group stands: not started, in progress, settled, or one for the Board
  function sdState(g){
    var alive = g.members.filter(function(c){ return sdStreak(c).alive; });
    var started = g.members.some(function(c){ return c.sd.some(function(v){ return v; }); });
    var done = g.members.every(function(c){
      return c.sd.slice(0,state.meta.sdCount).every(function(v){ return v; });
    });
    return {alive:alive, started:started, done:done,
            decided: started && alive.length===1,
            stuck: started && (alive.length===0 || (done && alive.length>1))};
  }
  // the ties still wanting the operator's attention — drives the alert and the tab dot
  function pendingTies(){
    var u = unresolved();
    if(!u) return null;
    var p = u.filter(function(g){ return !sdState(g).decided; });
    return p.length ? p : null;
  }

  /* A settled tie-break is signed by who was in it and who came through. The
     operator clears the section away once, and it stays away — but correcting a
     mark changes the signature, so the grid comes back rather than hiding a
     result nobody has looked at. The marks themselves are never cleared: the
     placings are ordered by sdKey, so wiping them would put the tie back. */
  function sdSig(g, winner){
    return g.members.map(function(c){ return c.no; }).sort(function(a,b){ return a-b; }).join("-")+
      ">"+winner.no;
  }
  function sdOutcome(g){
    var st = sdState(g);
    if(!st.decided) return null;
    var w = st.alive[0];
    return {sig:sdSig(g,w), winner:w.no, place:g.place, name:w.name,
            others:g.members.filter(function(c){ return c!==w; })
                            .map(function(c){ return c.name || ("No. "+c.no); })};
  }
  function sdOutcomes(){
    return (unresolved()||[]).map(sdOutcome).filter(Boolean);
  }
  function sdAcked(sig){
    return (state.sdAck||[]).some(function(a){ return a.sig===sig; });
  }
  // what the tie-break tab shows: everything except the results already cleared away
  function consoleTies(){
    var u = unresolved();
    if(!u) return null;
    var open = u.filter(function(g){
      var o = sdOutcome(g);
      return !(o && sdAcked(o.sig));
    });
    return open.length ? open : null;
  }

  function decidedBy(c){
    var peers = named().filter(function(x){ return x!==c && grand(x)===grand(c); });
    if(!peers.length) return "";
    if(peers.every(function(x){ return rt(x,"r1")!==rt(c,"r1"); })) return "settled on Round 1";
    if(peers.every(function(x){ return rt(x,"r2")!==rt(c,"r2"); })) return "settled on Round 2";
    if(hasSd() && peers.every(function(x){ return sdKey(x)!==sdKey(c); })) return "settled on sudden death";
    return "tied — needs a tie-break";
  }

  /* ===================== coaches =====================
     A coach is encoded once, with the school they bring. Which coach a
     contestant is under then follows from the school rather than from a second
     piece of data entry: one coach there and every contestant of that school is
     theirs. Two or more at the same school is the only case nobody can infer,
     so that — and only that — is what the roster asks about. */
  function normSch(s){ return String(s==null?"":s).trim().toLowerCase().replace(/\s+/g," "); }
  function coaches(){ return state.coaches || (state.coaches = []); }
  function namedCoaches(){ return coaches().filter(function(k){ return k.name.trim()!==""; }); }
  function coachesAt(school){
    var n = normSch(school);
    if(!n) return [];
    return namedCoaches().filter(function(k){ return normSch(k.school)===n; });
  }
  function newCoachId(){
    var used = coaches().map(function(k){ return k.id; }), n = 1;
    while(used.indexOf("k"+n)>=0) n++;
    return "k"+n;
  }
  /* The coach a contestant is under, or null when the school has nobody encoded
     — or has several and none has been picked. A chosen coach is only honoured
     while they are still at the contestant's school, so editing either school
     re-derives rather than leaving a contestant under someone else's school. */
  function coachOf(c){
    var at = coachesAt(c.school);
    if(!at.length) return null;
    if(c.coachId){
      var pick = at.filter(function(k){ return k.id===c.coachId; })[0];
      if(pick) return pick;
    }
    return at.length===1 ? at[0] : null;
  }
  function coachName(c){ var k = coachOf(c); return k ? k.name : ""; }
  function needsCoach(c){ return coachesAt(c.school).length>1 && !coachOf(c); }
  function unassigned(){ return named().filter(needsCoach); }
  // schools on the roster that no coach has been encoded for
  function coachlessSchools(){
    var out = [], seen = {};
    named().forEach(function(c){
      var n = normSch(c.school);
      if(!n || seen["s"+n] || coachesAt(c.school).length) return;
      seen["s"+n] = 1; out.push(c.school);
    });
    return out;
  }
  /* Institutions are not encoded anywhere — a school is whatever was typed on the
     roster and against the coaches, an organisation whatever was typed against a
     judge. The two are the same kind of thing as far as a logo goes, so one
     registry holds both, keyed on the name the same way coaches are matched. An
     entry whose name is no longer typed anywhere is kept rather than pruned, so
     correcting a spelling and typing it back brings the logo with it.
     (The state key stays `schools` so sessions saved before judges still open.) */
  function logoStore(){ return state.schools || (state.schools = []); }
  function logoEntry(name){
    var n = normSch(name);
    if(!n) return null;
    return logoStore().filter(function(x){ return normSch(x.name)===n; })[0] || null;
  }
  function logoFor(name){
    var e = logoEntry(name);
    return e && isPhoto(e.logo) ? e.logo : null;
  }
  function setLogo(name, uri){
    var e = logoEntry(name);
    if(!e){ e = {name:String(name==null?"":name).trim(), logo:null}; logoStore().push(e); }
    e.logo = uri;
  }
  function clearLogo(name){
    var n = normSch(name);
    state.schools = logoStore().filter(function(x){ return normSch(x.name)!==n; });
  }
  // every school and organisation named anywhere, alphabetically, with who uses it
  function logoList(){
    var seen = {}, out = [];
    function add(name, field){
      var n = normSch(name);
      if(!n) return;
      var e = seen["s"+n];
      if(!e){
        e = seen["s"+n] = {key:n, name:String(name).trim(), contestants:0, coaches:0,
                           judges:0, speakers:0};
        out.push(e);
      }
      e[field]++;
    }
    named().forEach(function(c){ add(c.school, "contestants"); });
    state.contestants.forEach(function(c){ if(!c.name.trim()) add(c.school, "contestants"); });
    namedCoaches().forEach(function(k){ add(k.school, "coaches"); });
    namedJudges().forEach(function(j){ add(j.org, "judges"); });
    // and the organisations named on the programme — a speaker's seal sits beside
    // them on their card exactly as a judge's does
    prog().forEach(function(p){ if(p.name.trim()) add(p.org, "speakers"); });
    namedHosts().forEach(function(h){ add(h.org, "speakers"); });
    out.sort(function(a,b){ return a.key<b.key ? -1 : 1; });
    return out;
  }

  /* The Board of Judges — Section A of the mechanics. They are introduced one to
     a screen, in the order they are listed here, so the list is the running
     order and the arrows in the panel are how it is set. */
  var JUDGE_ROLES = ["Chairman", "Member"];
  function judges(){ return state.judges || (state.judges = []); }
  function namedJudges(){ return judges().filter(function(j){ return j.name.trim()!==""; }); }
  function chairs(){ return namedJudges().filter(function(j){ return j.role==="Chairman"; }); }

  function initials(s){
    var p = String(s==null?"":s).trim().split(/\s+/).filter(Boolean);
    if(!p.length) return "?";
    return (p[0].charAt(0) + (p.length>1 ? p[p.length-1].charAt(0) : "")).toUpperCase();
  }

  /* The introduction runs school by school, alphabetically. A school with one
     coach is one group; a school with several is split a group per coach, so the
     pairing the audience sees is the one the operator encoded and never a
     guess. Contestants at such a school with no coach picked come last, in a
     group of their own — the console has been asking for them all along. */
  function introGroups(){
    var buckets = [], index = {};
    named().slice().sort(function(a,b){ return a.no-b.no; }).forEach(function(c){
      var key = normSch(c.school);
      var b = index["s"+key];                        // prefixed, so a school named "constructor" is just a school
      if(!b){ b = index["s"+key] = {key:key, school:c.school||"", students:[]}; buckets.push(b); }
      b.students.push(c);
    });
    // alphabetical by school, with any contestant who has no school given last
    buckets.sort(function(a,b){
      if(!a.key !== !b.key) return a.key ? -1 : 1;
      return a.key<b.key ? -1 : (a.key>b.key ? 1 : 0);
    });

    var out = [];
    buckets.forEach(function(b){
      var at = coachesAt(b.school);
      if(at.length<2){
        out.push({school:b.school, coach:at[0]||null, students:b.students});
        return;
      }
      var placed = [];
      at.slice().sort(function(x,y){ return normSch(x.name)<normSch(y.name) ? -1 : 1; }).forEach(function(k){
        var mine = b.students.filter(function(c){ return coachOf(c)===k; });
        if(!mine.length) return;
        out.push({school:b.school, coach:k, students:mine});
        placed = placed.concat(mine);
      });
      var rest = b.students.filter(function(c){ return placed.indexOf(c)<0; });
      if(rest.length) out.push({school:b.school, coach:null, students:rest});
    });
    return out;
  }

  /* The screens that introduction actually turns into: a school's contestants
     first — at Portraits per page, so a big school takes more than one screen —
     and then the coach who brought them. A group with no coach encoded simply
     has no coach screen after it. */
  function introScreens(){
    var out = [], n = Math.max(1, introPer);
    introGroups().forEach(function(g){
      for(var i=0;i<g.students.length;i+=n){
        out.push({kind:"students", school:g.school, coach:g.coach,
                  students:g.students.slice(i, i+n), from:i, of:g.students.length});
      }
      if(g.coach) out.push({kind:"coach", school:g.school, coach:g.coach});
    });
    return out;
  }

  /* ===================== the programme =====================
     Until now the board knew only the parts of the day that carry a score. The
     rest of the programme — the prayer, the welcome, the inspirational message,
     the two awardings, the closing remarks — happened around it while the screen
     sat on a title card.

     So the whole programme is encoded here, in the order it runs, and the board
     drives it. Every segment says what the audience should see while it is on,
     and taking the next one puts that on screen. The printed programme and the
     projector cannot drift apart, because they are the same list read twice. */

  var PART_LABEL = {1:"Part I", 2:"Part II — Contest proper"};

  /* What a segment puts on screen when it is taken. Most are the board's own
     cues; "segment" is the card built from the segment itself — its title, and
     whoever is taking it. */
  var PROG_CUES = [
    {v:"segment",     t:"This segment’s own card"},
    {v:"standby",     t:"Title card"},
    {v:"programme",   t:"The programme"},
    {v:"mechanics",   t:"Contest mechanics"},
    {v:"introduce",   t:"Introduce contestants"},
    {v:"judges",      t:"Board of Judges"},
    {v:"round",       t:"Round scores"},
    {v:"advancing",   t:"Advancing to Round 3"},
    {v:"leaderboard", t:"Leaderboard"},
    {v:"reveal",      t:"2nd & 3rd placers"},
    {v:"champion",    t:"Champion card"},
    {v:"blank",       t:"Blank the screen"}
  ];

  /* The 30th PSQ Provincial Elimination programme as printed. It is seeded
     rather than left blank for the same reason the event name and the date are:
     this board is built for one contest, and every line of it is editable. */
  function defaultProgramme(){
    function s(id, part, title, extra){
      var o = {id:id, part:part, title:title, items:[], name:"", office:"",
               org:"", photo:null, cue:"segment", round:null, done:false};
      if(extra) for(var k in extra) o[k] = extra[k];
      return o;
    }
    return [
      s("reg",     1, "Registration", {office:"Secretariat"}),
      s("prelim",  1, "Preliminaries", {items:["Prayer","National Anthem","MIMAROPA Hymn"]}),
      s("welcome", 1, "Welcome Message",
        {name:"Gemma N. Opis", office:"Chief Statistical Specialist"}),
      s("guest",   1, "Introduction of Guest Speaker",
        {name:"Abejen Shayne P. Mayores", office:"Statistical Analyst"}),
      s("inspire", 1, "Inspirational Message",
        {name:"Hon. Aurelio Leva III", office:"Provincial Board Member"}),
      s("present", 1, "Presentation of the Contestants and Coaches", {cue:"introduce"}),
      s("board",   1, "Introduction of the Members of the Board of Judges", {cue:"judges"}),
      s("mech",    2, "Presentation of the Contest Mechanics", {cue:"mechanics"}),
      s("rd1",     2, "Round 1", {cue:"round", round:"r1"}),
      s("rd2",     2, "Round 2", {cue:"round", round:"r2"}),
      s("appre",   2, "Awarding of Certificate of Appreciation",
        {items:["Judges & Sponsors"]}),
      s("rd3",     2, "Round 3", {cue:"round", round:"r3"}),
      s("partic",  2, "Awarding of Certificate of Participation",
        {items:["Contestants and Coaches"]}),
      s("winners", 2, "Announcement of Winners and Awarding of Prizes", {cue:"reveal"}),
      s("closing", 2, "Closing Remarks",
        {name:"Harvy M. Fabaleña", office:"Senior Statistical Specialist"})
    ];
  }
  /* The emcee and the Quizmaster are not segments — they are on all day. They
     sit at the foot of the printed programme, and at the foot of the screen. */
  function defaultHosts(){
    return [{role:"Emcee",      name:"Sonny Jr. R. Dela Cruz",   org:"", photo:null},
            {role:"Quiz Master", name:"Frenz Darren J. Medallon", org:"", photo:null}];
  }

  function prog(){ return state.programme || (state.programme = defaultProgramme()); }
  function hosts(){ return state.hosts || (state.hosts = defaultHosts()); }
  function namedHosts(){ return hosts().filter(function(h){ return h.name.trim()!==""; }); }
  function segById(id){
    if(!id) return null;
    return prog().filter(function(p){ return p.id===id; })[0] || null;
  }
  function nowSeg(){ return segById(state.progNow); }
  function segIndex(seg){ return seg ? prog().indexOf(seg) : -1; }
  function newSegId(){ var n = 1; while(segById("s"+n)) n++; return "s"+n; }
  function segDone(){ return prog().filter(function(p){ return p.done; }).length; }
  function segWhere(seg){ return seg ? PART_LABEL[seg.part]+" · "+seg.title : ""; }

  /* Taking a segment is the one move the run of show has: it becomes the one
     that is on, the one it replaces is marked off, and the screen follows to
     whatever that segment says it should carry. Nothing here is automatic —
     the programme advances when the emcee does, not when a score arrives. */
  function takeSegment(id){
    var seg = segById(id);
    if(!seg) return;
    var prev = nowSeg();
    if(prev && prev!==seg) prev.done = true;
    seg.done = false;
    state.progNow = seg.id;
    disp.page = 0;
    if(seg.cue==="round" && seg.round) setCue("round", seg.round);
    else setCue(seg.cue || "segment");
    toast("On now: "+seg.title);
  }
  function stepSegment(d){
    var list = prog();
    if(!list.length){ toast("No programme encoded"); return; }
    var i = segIndex(nowSeg());
    var to = i<0 ? (d>0 ? 0 : list.length-1) : i+d;
    if(to<0){ toast("That is the first segment"); return; }
    if(to>=list.length){ toast("That was the last segment"); return; }
    takeSegment(list[to].id);
  }
  function toggleSegDone(i){
    var p = prog()[i];
    if(!p) return;
    p.done = !p.done;
    if(p.done && state.progNow===p.id) state.progNow = null;
    render();
  }
  function addSegment(){
    var now = nowSeg();
    prog().push({id:newSegId(), part:(now?now.part:1), title:"", items:[], name:"",
                 office:"", org:"", photo:null, cue:"segment", round:null, done:false});
    render();
    var el = document.querySelector('.pin[data-pf="title"][data-pi="'+(prog().length-1)+'"]');
    if(el) el.focus();
  }
  function removeSegment(i){
    var p = prog()[i];
    if(!p) return;
    if(p.title.trim() && !confirm("Delete “"+p.title+"” from the programme?")) return;
    if(state.progNow===p.id) state.progNow = null;
    prog().splice(i,1);
    photoFor = null;                    // a file picker mid-flight no longer knows its row
    render(); toast((p.title.trim()||"The segment")+" deleted");
  }
  function moveSegment(i, d){
    var list = prog(), to = i+d;
    if(to<0 || to>=list.length) return;
    var tmp = list[i]; list[i] = list[to]; list[to] = tmp;
    photoFor = null;
    render();
    var el = document.querySelector('[data-pmove="'+to+'"][data-dir="'+d+'"]');
    if(el && !el.disabled) el.focus();
  }
  function resetProgramme(){
    if(!confirm("Restore the standard programme?\n\nEvery segment you have added, renamed or "+
                "reordered is replaced, and the photographs on them go too. The roster, the "+
                "judges and the tally are untouched.")) return;
    state.programme = defaultProgramme();
    state.progNow = null;
    photoFor = null;
    render(); toast("The standard programme is back");
  }
  function addHost(){
    hosts().push({role:"", name:"", org:"", photo:null});
    render();
    var el = document.querySelector('.hin[data-hf="role"][data-hi="'+(hosts().length-1)+'"]');
    if(el) el.focus();
  }
  function removeHost(i){
    var h = hosts()[i];
    if(!h) return;
    if(h.name.trim() && !confirm("Delete "+h.name+"?")) return;
    hosts().splice(i,1);
    photoFor = null;
    render(); toast((h.name.trim()||"The row")+" deleted");
  }

  /* ---- the run of show, on the operator's side ----
     The same row goes on the Display desk, on the Run tab and at the top of the
     Programme tab, because the operator may be on any of the three when the
     emcee moves on. */
  function progRow(){
    var list = prog(), now = nowSeg(), i = segIndex(now);
    var note = now
      ? esc(segWhere(now))+" · "+(i+1)+" of "+list.length+" · "+segDone()+" done"
      : (list.length ? "Nothing taken yet — Next starts at “"+esc(list[0].title)+"”"
                     : "No programme encoded — the Programme tab builds one");
    return '<div class="deskrow"><span class="lab">Programme</span>'+
      '<button class="lbtn" id="btnProgPrev"'+(i<=0?" disabled":"")+'>◀ Previous</button>'+
      '<button class="lbtn go" id="btnProgNext"'+
        (!list.length || i>=list.length-1 ? " disabled":"")+'>'+
        (now ? "Next segment ▶" : "Start the programme ▶")+'</button>'+
      '<button class="lbtn'+(disp.cue==="programme"?" on":"")+'" data-cue="programme">The programme</button>'+
      '<button class="lbtn'+(disp.cue==="segment"?" on":"")+'" data-cue="segment"'+
        (list.length?"":" disabled")+'>This segment</button>'+
      '<span class="note">'+note+'</span></div>';
  }

  /* ---- the Programme tab ---- */
  function renderProgramme(){
    var list = prog(), now = nowSeg();
    var rows = list.map(function(p,i){
      var has = isPhoto(p.photo);
      var isNow = now===p;
      return '<tr class="'+(isNow?"segnow":(p.done?"segdone":""))+'">'+
        '<td class="no pad">'+(i+1)+'</td>'+
        '<td class="pad"><select class="psel" data-ppart="'+i+'" aria-label="Part for '+
          esc(p.title||("segment "+(i+1)))+'">'+
          [1,2].map(function(n){
            return '<option value="'+n+'"'+(p.part===n?" selected":"")+'>'+
              (n===1?"I":"II")+'</option>';
          }).join("")+'</select></td>'+
        '<td class="pad segcell">'+
          '<input class="pin" data-pf="title" data-pi="'+i+'" value="'+esc(p.title)+
            '" placeholder="Segment">'+
          '<input class="pin sub" data-pf="items" data-pi="'+i+'" value="'+
            esc((p.items||[]).join(", "))+'" placeholder="Sub-items, separated by commas">'+
        '</td>'+
        '<td class="pad segcell">'+
          '<input class="pin" data-pf="name" data-pi="'+i+'" value="'+esc(p.name)+
            '" placeholder="Who takes it (optional)">'+
          '<input class="pin sub" data-pf="office" data-pi="'+i+'" value="'+esc(p.office)+
            '" placeholder="Position">'+
        '</td>'+
        '<td class="pad orgcell"><input class="pin" data-pf="org" data-pi="'+i+'" value="'+esc(p.org)+
          '" placeholder="Organisation" list="schoolList"></td>'+
        '<td class="pad photocell">'+
          (has ? '<img class="thumb" src="'+p.photo+'" alt="'+esc(p.name)+'">'
               : '<span class="thumb none">'+esc(p.name.trim()?initials(p.name):"—")+'</span>')+
          '<button class="lbtn tiny" data-pphoto="'+i+'">'+(has?"Replace":"Add photo")+'</button>'+
          (has ? '<button class="lbtn tiny danger" data-punphoto="'+i+'">Remove</button>' : '')+
        '</td>'+
        '<td class="pad">'+
          '<select class="psel" data-pcue="'+i+'" aria-label="What the screen shows during '+
            esc(p.title||("segment "+(i+1)))+'">'+
            PROG_CUES.map(function(c){
              return '<option value="'+c.v+'"'+(p.cue===c.v?" selected":"")+'>'+esc(c.t)+'</option>';
            }).join("")+'</select>'+
          (p.cue==="round"
            ? '<select class="psel sub" data-pround="'+i+'" aria-label="Which round">'+
              ["r1","r2","r3"].map(function(k){
                return '<option value="'+k+'"'+(p.round===k?" selected":"")+'>'+LABEL[k]+'</option>';
              }).join("")+'</select>'
            : '')+
        '</td>'+
        '<td class="st">'+(isNow
          ? '<span class="pill now">on now</span>'
          : (p.done ? '<span class="pill done">done</span>' : '—'))+'</td>'+
        '<td class="pad actions">'+
          '<button class="lbtn tiny'+(isNow?" on":" go")+'" data-ptake="'+p.id+'">'+
            (isNow?"On screen":"Take it")+'</button>'+
          '<button class="lbtn tiny" data-pdone="'+i+'">'+(p.done?"Not done":"Done")+'</button>'+
          '<button class="lbtn tiny" data-pmove="'+i+'" data-dir="-1"'+(i===0?" disabled":"")+
            ' aria-label="Move earlier">▲</button>'+
          '<button class="lbtn tiny" data-pmove="'+i+'" data-dir="1"'+(i===list.length-1?" disabled":"")+
            ' aria-label="Move later">▼</button>'+
          '<button class="lbtn tiny danger" data-pdel="'+i+'">Delete</button>'+
        '</td></tr>';
    }).join("");

    var body = list.length
      ? '<div class="scroll"><table><thead><tr><th class="c">No.</th><th class="c">Part</th>'+
        '<th>Segment</th><th>Who takes it</th><th>Organisation</th><th class="c">Photo</th>'+
        '<th>On screen</th><th class="c">Status</th><th></th></tr></thead><tbody>'+rows+
        '</tbody></table></div>'
      : '<div class="empty-state"><p>No programme encoded. The board can run the whole day from '+
        'this list — every segment, in order, with what the audience sees during it.</p>'+
        '<button class="lbtn go" id="btnProgReset">Load the standard programme</button></div>';

    var p1 = list.filter(function(p){ return p.part===1; }).length;

    return '<div class="panel">'+
      '<div class="panel-head"><h3>Programme</h3>'+
      '<span class="note">'+list.length+' segment'+(list.length===1?"":"s")+
        ' · '+p1+' in Part I, '+(list.length-p1)+' in Part II · '+segDone()+' done</span>'+
      '<div class="right"><button class="lbtn" id="btnAddSeg">Add a segment</button>'+
      '<button class="lbtn" id="btnProgReset">Restore the standard programme</button></div></div>'+
      '<div class="desk" style="padding:0 15px 14px">'+progRow()+'</div>'+
      body+
      '<div class="legend">Take it puts the segment on and marks the one before it done — or use '+
      'Previous and Next, here, on the Display tab or on the Run tab. The left and right arrow keys '+
      'do the same while this tab is open. <b>On screen</b> is what the audience sees when a segment '+
      'is taken: its own card by default, or one of the board’s cues, so Round 1 puts the Round 1 '+
      'scores up and the presentation of the contestants starts the introductions. '+
      'Sub-items are the lines under a heading — the prayer, the anthem and the hymn under '+
      'Preliminaries. A segment with nobody named is a heading; name someone and it becomes a card '+
      'with their portrait, position and organisation, the same card the coaches and judges get.</div>'+
      '</div>'+
      renderHostPanel()+
      '<datalist id="schoolList">'+schoolOptions()+'</datalist>';
  }

  function renderHostPanel(){
    var hs = hosts();
    var rows = hs.map(function(h,i){
      var has = isPhoto(h.photo);
      return '<tr><td class="no pad">'+(i+1)+'</td>'+
        '<td class="pad"><input class="hin" data-hf="role" data-hi="'+i+'" value="'+esc(h.role||"")+
          '" placeholder="Emcee, Quiz Master…"></td>'+
        '<td class="pad"><input class="hin" data-hf="name" data-hi="'+i+'" value="'+esc(h.name)+
          '" placeholder="Name"></td>'+
        '<td class="pad orgcell"><input class="hin" data-hf="org" data-hi="'+i+'" value="'+esc(h.org||"")+
          '" placeholder="Organisation (optional)" list="schoolList"></td>'+
        '<td class="pad photocell">'+
          (has ? '<img class="thumb" src="'+h.photo+'" alt="'+esc(h.name)+'">'
               : '<span class="thumb none">'+esc(initials(h.name))+'</span>')+
          '<button class="lbtn tiny" data-hphoto="'+i+'">'+(has?"Replace":"Add photo")+'</button>'+
          (has ? '<button class="lbtn tiny danger" data-hunphoto="'+i+'">Remove</button>' : '')+
        '</td>'+
        '<td class="pad actions"><button class="lbtn tiny danger" data-hdel="'+i+'">Delete row</button></td>'+
        '</tr>';
    }).join("");

    var body = hs.length
      ? '<div class="scroll"><table><thead><tr><th class="c">No.</th><th>Role</th><th>Name</th>'+
        '<th>Organisation</th><th class="c">Photo</th><th></th></tr></thead><tbody>'+rows+
        '</tbody></table></div>'
      : '<div class="empty-state"><p>Nobody encoded. The emcee and the Quizmaster sit at the foot '+
        'of the printed programme — they sit at the foot of the screen too.</p>'+
        '<button class="lbtn go" id="btnAddHost">Add a name</button></div>';

    return '<div class="panel"><div class="panel-head"><h3>Emcee &amp; Quizmaster</h3>'+
      '<span class="note">'+namedHosts().length+' encoded · shown on the title card and under the programme</span>'+
      '<div class="right"><button class="lbtn" id="btnAddHost2">Add a name</button></div></div>'+
      body+
      '<div class="legend">These two are on all day rather than at one point of the programme, so they '+
      'are not segments. They appear under the programme on screen and under the date on the title card. '+
      'A photograph is optional — nothing on screen shows one yet, but it rides in the saved session '+
      'with the rest.</div></div>';
  }

  /* ---- the audience screens ---- */

  // the emcee and the Quizmaster, as the printed programme carries them
  function hostsFootHTML(){
    var hs = namedHosts();
    if(!hs.length) return "";
    return '<div class="hosts">'+hs.map(function(h){
      return '<div class="host"><b>'+esc(h.name)+'</b><span>'+esc(h.role||"")+'</span></div>';
    }).join("")+'</div>';
  }

  /* On the title card there is no room for the chips, and no need for them: one
     line under the options names the two who are on all day. */
  function hostsLineHTML(){
    var hs = namedHosts();
    if(!hs.length) return "";
    return '<div class="hostline">'+hs.map(function(h){
      return (h.role ? esc(h.role)+" " : "")+"<b>"+esc(h.name)+"</b>";
    }).join(" · ")+'</div>';
  }

  /* The programme as printed: the two parts side by side, every segment in
     order, the one that is on marked and the ones behind it ticked off. */
  function programmeSceneHTML(){
    var list = prog(), now = nowSeg();
    if(!list.length) return '<div class="dsp">'+dspHead("Programme")+
      '<div class="body"><div class="none">No programme encoded</div></div></div>';

    var parts = [1,2].map(function(n){
      var rows = list.filter(function(p){ return p.part===n; });
      if(!rows.length) return "";
      return '<div class="part"><div class="phead">'+esc(PART_LABEL[n])+'</div>'+
        rows.map(function(p){
          var who = p.name.trim();
          return '<div class="pline'+(p===now?" now":(p.done?" done":""))+'">'+
            '<div class="pt"><b>'+esc(p.title)+'</b>'+
            ((p.items||[]).length
              ? '<span class="pit">'+esc(p.items.join(" · "))+'</span>' : '')+'</div>'+
            (who || p.office
              ? '<div class="pw">'+(who?'<b>'+esc(who)+'</b>':'')+
                (p.office?'<span>'+esc(p.office)+'</span>':'')+'</div>'
              : '')+
          '</div>';
        }).join("")+'</div>';
    }).join("");

    return '<div class="dsp">'+dspHead("Programme")+
      '<div class="body" style="justify-content:flex-start;padding-top:calc(var(--u)*2)">'+
      '<div class="pgm">'+parts+'</div>'+hostsFootHTML()+'</div></div>';
  }

  /* One segment, in two screens: its title, then whoever is taking it. The
     title used to sit in small type on the portrait card, where a long one
     crowded the name; announced on its own it reads as the emcee says it. A
     segment with nobody named is the title screen alone. */
  function segScreens(seg){
    if(!seg) return [];
    return seg.name.trim() ? [{who:false},{who:true}] : [{who:false}];
  }
  /* ===================== segment media =====================
     A preliminary is a video, not a card: the prayer, the anthem and the hymn
     are all played from a file. The file is found by the item's own name, so
     there is nothing to configure — rename the item and rename the file to
     match. Missing file, missing name, no harm: the item just stays a card. */
  var playing = null;                       // the item text being played, or null
  function mediaSlug(t){
    return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  /* Absolute, because the audience window is written into about:blank and has
     no base URL of its own to resolve "media/..." against. */
  function mediaURL(t){
    try{ return new URL("media/" + mediaSlug(t) + ".mp4", location.href).href; }
    catch(err){ return ""; }
  }
  function playMedia(t){ playing = t || null; render(); }
  function mediaSceneHTML(){
    return '<div class="dsp run">' +
      '<video class="slidevid" src="' + esc(mediaURL(playing)) + '" autoplay controls></video>' +
      '<button class="sbtn medback" data-media="">Back to the programme</button></div>';
  }

  function segmentSceneHTML(){
    var seg = nowSeg() || prog().filter(function(p){ return !p.done; })[0] || null;
    if(!seg) return '<div class="dsp">'+dspHead("Programme")+
      '<div class="body"><div class="none">No segment is on</div></div></div>';

    var pg = pageOf(segScreens(seg)), sc = pg.slice[0];
    var body;
    if(sc && sc.who){
      body = '<div class="intro solo" style="grid-template-columns:repeat(1,minmax(0,1fr))">'+
        '<div class="icard">'+portrait(seg)+
        '<div class="itxt"><div class="who">'+esc(seg.name)+'</div>'+
        (seg.office ? '<div class="sch">'+esc(seg.office)+'</div>' : '')+
        orgLine(seg.org)+
        '</div></div></div>';
    } else {
      body = '<div class="seg">'+
        '<div class="segt">'+esc(seg.title)+'</div>'+
        // the title alone — the name belongs on the card that follows it
        (!seg.name.trim() && seg.office ? '<div class="segby">'+esc(seg.office)+'</div>' : '')+
        ((seg.items||[]).length
          ? '<div class="segitems">'+seg.items.map(function(t){
              return '<button class="segitem" data-media="'+esc(t)+'">'+esc(t)+'</button>'; }).join("")+'</div>'
          : '')+
        (seg.org && !seg.name.trim() ? orgLine(seg.org) : '')+
      '</div>';
    }
    return '<div class="dsp">'+dspHead(PART_LABEL[seg.part])+
      '<div class="body">'+body+
      pagerHTML(pg, 'Screen '+(disp.page+1)+' of '+pg.pages)+'</div></div>';
  }

  /* ===================== the deck =====================
     The Regional Technical Committee sends the questions as a PowerPoint deck.
     A .pptx holds layout XML, not rendered slides, so the board does not read it:
     the operator exports the deck to pictures once, in preparation, and imports
     the pictures. What the audience sees is then exactly what the RTC designed.

     The board needs to know almost nothing about a slide — only which ones are
     questions, so it can arm the right clock and line the tally up with the right
     box. Everything else is the picture's business. */

  var SLIDE_MAX = 1600;             // long side; a projector rarely exceeds 1920
  var DEFAULT_SECONDS = 15;
  /* The trial comes first because it is asked first — Section B of the mechanics
     gives one trial question before Round 1 starts, so the contestants can
     practise raising their answers before anything counts. */
  var ROUNDS = ["trial", "r1", "r2", "r3", "sd"];

  var deckSel = [];                 // slide indices selected in the console
  var deckAnchor = null;            // where a shift-click range starts from
  var deckSeconds = DEFAULT_SECONDS;

  function deck(){ return state.deck || (state.deck = {name:"", slides:[]}); }
  function slides(){ return deck().slides || (deck().slides = []); }
  function hasDeck(){ return slides().length > 0; }
  function roundName(r){
    return r === "sd" ? "Tie-break" : (r === "trial" ? "Trial" : (LABEL[r] || "—"));
  }
  /* Two different counts, and the trial is the reason they part company. Boxes
     are what the tally has room for: the trial has none, because it is never
     scored — no contestant's sheet has a trial mark on it and PSQ Form 1 has
     nowhere to put one. Questions wanted is what the deck should hold, and the
     trial wants exactly the one. */
  function boxesFor(r){
    return r === "sd" ? state.meta.sdCount : (r === "trial" ? 0 : QN);
  }
  function qWanted(r){ return r === "trial" ? 1 : boxesFor(r); }

  /* A question slide's number is its position among the question slides of its
     round. Deriving it rather than storing it means it cannot fall out of step
     with the deck when a slide is retagged or the deck is re-imported. */
  function qIndexOf(i){
    var s = slides()[i];
    if(!s || s.role !== "question" || !s.round) return 0;
    var n = 0;
    for(var j = 0; j <= i; j++){
      var t = slides()[j];
      if(t.role === "question" && t.round === s.round) n++;
    }
    return n;
  }
  function qSlides(round){
    return slides().filter(function(s){ return s.role === "question" && s.round === round; });
  }
  // the slide that asks question q of a round, or null — this is the join
  // between the deck and the tally
  function slideForQuestion(round, q){
    var found = null;
    slides().forEach(function(s, i){
      if(!found && s.role === "question" && s.round === round && qIndexOf(i) === q) found = i;
    });
    return found;
  }

  /* What the operator still has to put right. A round with no question slides at
     all is not a problem — it just has not been tagged yet. */
  function deckProblems(){
