    var out = [];
    ROUNDS.forEach(function(r){
      var n = qSlides(r).length, want = qWanted(r);
      if(!n) return;
      if(r === "trial"){
        if(n > 1){
          out.push({bad:true, msg:n + " slides are tagged as the trial question — the mechanics give " +
                    "one trial question before Round 1, and none of them are scored"});
        }
        return;
      }
      if(n > want){
        out.push({bad:true, msg:n + " slides are tagged " + roundName(r) + " questions, but that round " +
                  "only has " + want + " boxes to tally — the last " + (n - want) + " cannot be scored"});
      } else if(n < want){
        out.push({bad:false, msg:roundName(r) + ": " + n + " of " + want + " questions tagged so far"});
      }
    });
    var untagged = slides().filter(function(s){ return s.role === "question" && !s.round; }).length;
    if(untagged){
      out.push({bad:true, msg:untagged + " slide" + (untagged === 1 ? " is" : "s are") +
                " tagged as a question but belong to no round"});
    }
    return out;
  }

  /* ---- importing ---- */

  // "Slide2.png" must sort before "Slide10.png", which plain string order does not
  function natKey(name){
    return String(name).replace(/\d+/g, function(d){
      var p = "0000000000" + d;
      return p.slice(p.length - Math.max(10, d.length));
    });
  }

  var deckBusy = null;              // {done, total} while an import is running

  function importSlides(fileList, done){
    var files = Array.prototype.slice.call(fileList).filter(function(f){
      return /^image\//.test(f.type);
    });
    if(!files.length){ toast("No pictures in that selection"); return; }
    files.sort(function(a, b){
      var ka = natKey(a.name), kb = natKey(b.name);
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });

    var out = [], i = 0, skipped = 0;
    deckBusy = {done:0, total:files.length};
    render();
    (function next(){
      if(i >= files.length){
        deckBusy = null;
        done(out, skipped);
        return;
      }
      deckBusy = {done:i, total:files.length};
      var el = $("deckProgress");
      if(el) el.textContent = "Reading slide " + (i + 1) + " of " + files.length + "…";
      // one at a time: thirty-five canvases at once would stall the tab
      shrink(files[i], function(uri){
        if(uri) out.push({image:uri, role:"other", round:null, seconds:null});
        else skipped++;
        i++;
        setTimeout(next, 0);        // let the console repaint between slides
      }, {max:SLIDE_MAX, best:true});
    })();
  }

  function takeSlides(list, skipped){
    deck().slides = list;
    deckSel = []; deckAnchor = null;
    render();
    toast(list.length + " slide" + (list.length === 1 ? "" : "s") + " imported" +
          (skipped ? " · " + skipped + " could not be read" : ""));
  }

  function clearDeck(){
    if(!hasDeck()) return;
    if(!confirm("Remove all " + slides().length + " slides?\n\n" +
                "The tally, the roster and everything else are untouched. " +
                "With no deck loaded the board works exactly as it did before one was imported.")) return;
    deck().slides = []; deck().name = "";
    deckSel = []; deckAnchor = null;
    render(); toast("Deck cleared");
  }

  function exportDeck(){
    if(!hasDeck()){ toast("No slides to export"); return; }
    dl("psq-deck-" + stamp() + ".json", JSON.stringify(deck()), "application/json");
    toast("Deck exported — import it again to skip the picture conversion");
  }

  // a deck file is only a deck: it never carries scores, so opening one cannot
  // disturb a contest in progress
  function loadDeckFile(text){
    try{
      var d = JSON.parse(text);
      if(!d || !Array.isArray(d.slides)) throw new Error("bad");
      var clean = d.slides.filter(function(s){ return s && isPhoto(s.image); }).map(function(s){
        return {
          image:   s.image,
          role:    (s.role === "question" || s.role === "answer") ? s.role : "other",
          round:   ROUNDS.indexOf(s.round) >= 0 ? s.round : null,
          seconds: (typeof s.seconds === "number" && s.seconds > 0) ? Math.round(s.seconds) : null
        };
      });
      if(!clean.length) throw new Error("empty");
      deck().name = typeof d.name === "string" ? d.name : "";
      deck().slides = clean;
      deckSel = []; deckAnchor = null;
      render();
      toast(clean.length + " slides loaded from the deck file");
    }catch(err){ toast("That file isn't a saved deck"); }
  }

  /* ---- selecting and tagging ---- */

  function selectSlide(i, shift){
    if(shift && deckAnchor !== null){
      var a = Math.min(deckAnchor, i), b = Math.max(deckAnchor, i);
      deckSel = [];
      for(var j = a; j <= b; j++) deckSel.push(j);
    } else {
      var at = deckSel.indexOf(i);
      if(at >= 0) deckSel.splice(at, 1);
      else deckSel.push(i);
      deckAnchor = i;
    }
    render();
  }
  function selectAll(on){
    deckSel = [];
    if(on) slides().forEach(function(_s, i){ deckSel.push(i); });
    deckAnchor = null;
    render();
  }
  function selected(){
    return deckSel.slice().sort(function(a, b){ return a - b; })
      .filter(function(i){ return slides()[i]; });
  }

  function tagSelection(role){
    var sel = selected();
    if(!sel.length){ toast("Select some slides first"); return; }
    sel.forEach(function(i){
      var s = slides()[i];
      s.role = role;
      if(role === "question" && !s.seconds) s.seconds = deckSeconds;
      if(role === "other"){ s.round = null; s.seconds = null; }
    });
    render();
  }
  function roundSelection(round){
    var sel = selected();
    if(!sel.length){ toast("Select some slides first"); return; }
    sel.forEach(function(i){
      var s = slides()[i];
      s.round = round;
      if(round && s.role === "other") s.role = "question";
      if(s.role === "question" && !s.seconds) s.seconds = deckSeconds;
    });
    render();
  }
  function secondsSelection(n){
    var sel = selected();
    if(!sel.length){ toast("Select some slides first"); return; }
    sel.forEach(function(i){
      if(slides()[i].role === "question") slides()[i].seconds = n;
    });
    render(); toast("Set to " + n + " seconds");
  }
  // most quiz decks run question, answer, question, answer — say so once
  function alternateSelection(){
    var sel = selected();
    if(sel.length < 2){ toast("Select the range first"); return; }
    sel.forEach(function(i, k){
      var s = slides()[i];
      s.role = k % 2 === 0 ? "question" : "answer";
      if(s.role === "question" && !s.seconds) s.seconds = deckSeconds;
    });
    render(); toast("Alternated across " + sel.length + " slides");
  }

  /* ---- the Deck tab ---- */

  function deckChip(i){
    var s = slides()[i];
    if(s.role === "question"){
      var q = qIndexOf(i);
      return '<span class="chip cq">' + (s.round ? roundName(s.round) : "no round") +
        ((q && s.round !== "trial") ? " Q" + q : "") + ' · ' + (s.seconds || DEFAULT_SECONDS) + 's</span>';
    }
    if(s.role === "answer"){
      return '<span class="chip ca">' + (s.round ? roundName(s.round) + " " : "") + 'answer</span>';
    }
    return '<span class="chip co">—</span>';
  }

  function renderDeck(){
    var sl = slides(), sel = selected();

    if(deckBusy){
      return '<div class="panel"><div class="panel-head"><h3>Deck</h3></div>' +
        '<div class="empty-state"><p id="deckProgress">Reading slide ' + (deckBusy.done + 1) +
        ' of ' + deckBusy.total + '…</p>' +
        '<p class="fine">Each picture is shrunk as it comes in. Large decks take a moment.</p>' +
        '</div></div>';
    }

    var head = '<div class="panel-head"><h3>Deck</h3><span class="note">' +
      (sl.length ? sl.length + ' slides · ' + qSlides("trial").length + '/' + qSlides("r1").length +
                   '/' + qSlides("r2").length + '/' + qSlides("r3").length + '/' + qSlides("sd").length +
                   ' questions tagged for the trial, Rounds 1, 2, 3 and the tie-break'
                 : 'no slides yet') + '</span>' +
      '<div class="right">' +
        '<button class="lbtn" id="btnSlides">' + (sl.length ? "Replace slides" : "Import slides") + '</button>' +
        '<button class="lbtn" id="btnDeckOpen">Open deck file</button>' +
        (sl.length ? '<button class="lbtn" id="btnDeckSave">Export deck</button>' +
                     '<button class="lbtn danger" id="btnDeckClear">Clear deck</button>' : '') +
      '</div></div>';

    if(!sl.length){
      return '<div class="panel">' + head +
        '<div class="empty-state">' +
        '<p>Export the RTC’s PowerPoint to pictures, then import them here.</p>' +
        '<p class="fine">In PowerPoint: <b>File → Export → Change File Type → PNG → Save → All Slides</b>. ' +
        'Pick the whole folder in one go; <code>Slide2</code> is sorted before <code>Slide10</code>.</p>' +
        '<button class="lbtn go" id="btnSlides2">Import slides</button></div>' +
        deckLegend() + '</div>';
    }

    var problems = deckProblems().map(function(p){
      return '<div class="banner ' + (p.bad ? "warn" : "info") + '">' + esc(p.msg) + '</div>';
    }).join("");

    var tools = '<div class="desk">' +
      '<div class="deskrow" style="margin-top:0;padding-top:0;border-top:0">' +
        '<span class="lab">Selected</span>' +
        '<span class="note"><b>' + sel.length + '</b> of ' + sl.length + ' slides' +
        (sel.length ? '' : ' — click a thumbnail, shift-click for a range') + '</span>' +
        '<button class="lbtn" id="btnDeckAll">Select all</button>' +
        '<button class="lbtn" id="btnDeckNone"' + (sel.length ? '' : ' disabled') + '>Clear selection</button>' +
      '</div>' +
      '<div class="deskrow"><span class="lab">Tag as</span>' +
        ['question,Question', 'answer,Answer', 'other,Not a question'].map(function(v){
          var p = v.split(",");
          return '<button class="lbtn" data-dtag="' + p[0] + '">' + p[1] + '</button>';
        }).join("") +
        '<button class="lbtn" id="btnDeckAlt">Alternate Q / A</button>' +
        '<span class="note">A deck that runs question, answer, question, answer is one click.</span></div>' +

  /* ---- adding and deleting roster rows ----
     A contestant's number is their slot: c.no is the row's own position, and
     the announced cut and the cleared tie-breaks are both recorded as numbers.
     So deleting a row closes the gap and renumbers from 1, and everything that
     was written down in numbers is carried across that renumbering rather than
     left pointing at a number nobody has any more. */
  function renumber(keep){
    var map = {};
    keep.forEach(function(c, ix){ map[c.no] = ix+1; });   // old number -> new
    keep.forEach(function(c, ix){ c.no = ix+1; });
    state.contestants = keep;
    photoFor = null;                    // a file picker mid-flight no longer knows its row

    if(state.cut){
      state.cut = state.cut.map(function(n){ return map[n]; }).filter(Boolean);
      if(!state.cut.length) state.cut = null;
    }
    // a cleared tie-break is signed by the numbers of everyone in it, so the
    // signature moves too — and is dropped outright if one of them is gone,
    // because that is no longer the tie the operator cleared away
    state.sdAck = (state.sdAck||[]).map(function(a){
      var half = String(a.sig).split(">");
      var mem = half[0].split("-").map(Number).map(function(n){ return map[n]; });
      var win = map[a.winner];
      if(!win || mem.some(function(n){ return !n; })) return null;
      mem.sort(function(x,y){ return x-y; });
      return {sig:mem.join("-")+">"+win, winner:win, place:a.place, name:a.name};
    }).filter(Boolean);
  }

  // a row nothing has been entered against — safe to take away in bulk
  function emptyRows(){
    return state.contestants.filter(function(c){
      return !c.name.trim() && !c.school.trim() && !isPhoto(c.photo) &&
             !c.r1.some(Boolean) && !c.r2.some(Boolean) && !c.r3.some(Boolean) &&
             !c.sd.some(function(v){ return v; });
    });
  }

  function removeContestant(i){
    var c = state.contestants[i];
    if(!c) return;
    if(state.contestants.length<=1){ toast("The roster needs one row at least"); return; }
    var marks = ["r1","r2","r3"].reduce(function(n,k){
      return n + c[k].filter(Boolean).length;
    }, 0);
    var sdMarks = c.sd.filter(function(v){ return v; }).length;
    var who = c.name.trim() || ("slot "+c.no);
    var touched = c.name.trim() || c.school.trim() || isPhoto(c.photo) || marks || sdMarks;

    if(touched){
      var msg = "Delete "+who+" from the roster?";
      if(marks || sdMarks){
        msg += "\n\n"+
          (marks ? marks+" ticked answer"+(marks===1?"":"s") : "")+
          (marks && sdMarks ? " and " : "")+
          (sdMarks ? sdMarks+" sudden-death mark"+(sdMarks===1?"":"s") : "")+
          " go with them.";
      }
      if(isPhoto(c.photo)) msg += "\n\nTheir photo goes too.";
      if(i < state.contestants.length-1){
        msg += "\n\nThe rows below move up a number: No. "+(c.no+1)+" becomes No. "+c.no+
               ", and so on. Scores stay with their contestant.";
      }
      if(!confirm(msg)) return;
    }
    renumber(state.contestants.filter(function(x){ return x!==c; }));
    render();
    toast(who+" deleted");
  }

  function trimEmpty(){
    var empty = emptyRows();
    if(!empty.length){ toast("No empty rows to delete"); return; }
    if(empty.length===state.contestants.length){ toast("Every row is empty — nothing to keep"); return; }
    if(!confirm("Delete "+empty.length+" empty row"+(empty.length===1?"":"s")+"?\n\n"+
                "Nothing has been entered against them. The "+
                (state.contestants.length-empty.length)+" rows that remain are renumbered from 1.")) return;
    renumber(state.contestants.filter(function(c){ return empty.indexOf(c)<0; }));
    render();
    toast(empty.length+" empty row"+(empty.length===1?"":"s")+" deleted");
  }

      : '<div class="empty-state"><p>No coaches encoded yet. The introduction screen names a contestant’s coach once there is one for their school.</p>'+
        '<button class="lbtn go" id="btnAddCoach">Add a coach</button></div>';

    return '<div class="panel">'+
      '<div class="panel-head"><h3>Coaches</h3>'+
      '<span class="note" id="coachNote">'+esc(coachHeadNote())+'</span>'+
      '<div class="right"><button class="lbtn" id="btnKPaste">Paste from Excel</button>'+
      '<button class="lbtn" id="btnAddCoach2">Add a coach</button></div></div>'+
      body+
      '<div class="paste" id="kPasteBox"><p>Paste the coaches from the registration sheet — one per line, name then school, tab or comma between the two.</p>'+
        '<textarea id="kPasteText" placeholder="Maria Santos&#9;Marinduque National High School"></textarea>'+
        '<div class="row"><button class="lbtn go" id="btnKPasteGo">Add these coaches</button>'+
        '<button class="lbtn" id="btnKPasteCancel">Cancel</button></div></div>'+
      '<div class="legend">A school with one coach needs nothing else — every contestant of that school is listed under them. '+
      'A school that has sent two or more puts a chooser in the roster’s Coach column instead, because only you know who coached whom. '+
      'Spell the school the same way in both tables; the box offers the ones already typed.</div></div>';
  }

  function coachHeadNote(){
    return namedCoaches().length+" encoded · one coach at a school claims all of its contestants";
  }
  function coachLoad(k){
    return named().filter(function(c){ return coachOf(c)===k; }).length;
  }
  function coachNote(k){
    if(!k.name.trim()) return '<span class="cmute">Give the coach a name</span>';
    if(!normSch(k.school)) return '<span class="cmute">Give the school</span>';
    var at = coachesAt(k.school);
    if(at.length>1) return '<span class="cwarn">'+at.length+' coaches at this school — pick per contestant above</span>';
    return coachLoad(k)
      ? '<span class="cmute">every contestant of this school</span>'
      : '<span class="cwarn">no contestant from this school on the roster</span>';
  }

  /* Almost everything on this tab is derived from the boxes being typed into:
     which coach a contestant falls under, the logo registry, the suggestions, the
     counts in the panel headings. A full redraw would take the operator's cursor
     out of the box mid-word, so the derived parts are refreshed in place instead.
     Only panels with no inputs of their own are rebuilt wholesale. */
  function refreshDerived(){
    var sp = $("schoolPanel");
    if(sp) sp.innerHTML = renderSchoolPanel();
    var dl = $("schoolList");
    if(dl) dl.innerHTML = schoolOptions();
    var cn = $("coachNote");
    if(cn) cn.textContent = coachHeadNote();
    var jn = $("judgeNote");
    if(jn) jn.textContent = judgeHeadNote();
    Array.prototype.forEach.call(document.querySelectorAll("td.coachcell"), function(td){
      var i = +td.dataset.ci;
      td.innerHTML = coachCell(state.contestants[i], i);
    });
    Array.prototype.forEach.call(document.querySelectorAll("td[data-kc]"), function(td){
      var k = coaches()[+td.dataset.kc];
      if(k) td.textContent = coachLoad(k);
    });
    Array.prototype.forEach.call(document.querySelectorAll("td[data-kn]"), function(td){
      var k = coaches()[+td.dataset.kn];
      if(k) td.innerHTML = coachNote(k);
    });
    var w = $("coachWarn"), fresh = document.createElement("div");
    if(w){ fresh.innerHTML = coachWarnHTML(); w.innerHTML = fresh.firstChild.innerHTML; }
  }

  function addCoach(){
    coaches().push({id:newCoachId(), name:"", school:"", photo:null});
    render();
    var el = document.querySelector('.kin[data-kf="name"][data-ki="'+(coaches().length-1)+'"]');
    if(el) el.focus();
  }
  function removeCoach(i){
    var k = coaches()[i];
    if(!k) return;
    var load = coachLoad(k);
    if(k.name.trim() && !confirm("Delete "+k.name+" from the coaches?"+
        (load ? "\n\n"+load+" contestant"+(load===1?"":"s")+" listed under them will be left without a coach "+
                "until another is encoded for the school." : ""))) return;
    coaches().splice(i,1);
    photoFor = null;                    // a file picker mid-flight no longer knows its row
    state.contestants.forEach(function(c){ if(c.coachId===k.id) c.coachId = null; });
    render(); toast((k.name.trim()||"The coach")+" deleted");
  }
  function loadCoachPaste(){
    var lines = $("kPasteText").value.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
    if(!lines.length){ toast("Nothing to load"); return; }
    var added = 0;
    lines.forEach(function(ln){
      var parts = ln.split(/\t|\s{2,}|,/);
      var nm = (parts[0]||"").trim(), sc = parts.slice(1).join(", ").trim();
      if(!nm) return;
      var dupe = coaches().some(function(k){
        return k.name.trim().toLowerCase()===nm.toLowerCase() && normSch(k.school)===normSch(sc);
      });
      if(dupe) return;
      coaches().push({id:newCoachId(), name:nm, school:sc, photo:null});
      added++;
    });
    $("kPasteBox").classList.remove("show"); $("kPasteText").value="";
    render();
    toast(added ? added+" coach"+(added===1?"":"es")+" added" : "Those coaches were already on the list");
  }

  function leadersLine(k, list){
    if(!list.some(function(c){ return c[k].some(Boolean) || (k!=="r1" && runTotal(c,k)>0); })) return "";
    var pos = posMap(k, list);
    var top = list.slice().sort(function(a,b){
      var d = runTotal(b,k)-runTotal(a,k);
      return d!==0 ? d : a.no-b.no;
    }).filter(function(c){ return pos.get(c)<=3; }).slice(0,6);
    if(!top.length) return "";
    var label = k==="r1" ? "Round 1" : (k==="r2" ? "Rounds 1 &amp; 2" : "all three rounds");
    return '<div class="banner ok">Leading on '+label+': '+
      top.map(function(c){ return '<b>'+pos.get(c)+'.</b> '+esc(c.name)+' ('+runTotal(c,k)+')'; }).join(' \u00b7 ')+
      '</div>';
  }

  function renderRound(k){
    var list = named();
    if(!list.length){
      return '<div class="panel"><div class="panel-head"><h3>'+LABEL[k]+'</h3></div>'+
        '<div class="empty-state"><p>Add contestants in the Roster tab to start tallying.</p>'+
        '<button class="lbtn go" data-goto="roster">Go to roster</button></div></div>';
    }
    var qual = k==="r3" ? qualifiers() : null;
    // once the cut is announced the eliminated leave the Round 3 grid altogether
    var rowList = (k==="r3" && isCut()) ? qual : list;
    var basisFn = k==="r1" ? function(c){return rt(c,"r1");} : (k==="r2" ? cum12 : grand);
    var pool = k==="r3" ? qual : list;
    var sc = pool.map(basisFn).slice().sort(function(a,b){ return b-a; });
    var rk = new Map();
    pool.forEach(function(c){ rk.set(c, sc.indexOf(basisFn(c))+1); });

    var head;
    if(k==="r1") head='<th class="c">Rank</th>';
    else if(k==="r2") head='<th class="c sep">Round 1</th><th class="c">Rounds 1 &amp; 2</th><th class="c">Rank</th>';
    else head='<th class="c sep">Rounds 1 &amp; 2</th><th class="c">All rounds</th><th class="c">Rank</th>';

    // the entry grid is always in contestant-number order — rows must never move
    // under the operator's cursor while they are ticking boxes
    var rows = rowList.slice().sort(function(a,b){ return a.no-b.no; }).map(function(c){
      var inR3 = k!=="r3" || qual.indexOf(c)>=0;
      var cls="";
      if(inR3){ var r=rk.get(c); if(r===1) cls="top top1"; else if(r<=3) cls="top"; }
      else cls="out";
      var extra;
      if(k==="r1") extra='<td class="rank"><span class="r">'+rk.get(c)+'</span></td>';
      else if(k==="r2") extra='<td class="cum sep">'+rt(c,"r1")+'</td><td class="cum">'+cum12(c)+'</td><td class="rank"><span class="r">'+rk.get(c)+'</span></td>';
      else extra='<td class="cum sep">'+cum12(c)+'</td><td class="cum">'+grand(c)+'</td><td class="rank"><span class="r">'+(inR3?rk.get(c):"—")+'</span></td>';
      return '<tr class="'+cls+'"><td class="no pad">'+c.no+'</td><td class="nm pad">'+esc(c.name)+'</td>'+
        '<td class="sch pad">'+esc(c.school||"—")+'</td>'+qCells(c,k,!inR3)+
        '<td class="tot">'+rt(c,k)+'</td>'+extra+'</tr>';
    }).join("");

    var banner="";
    if(k==="r2" && (hasMarks("r2") || isCut())){
      var q = qualifiers();
      var outs = named().filter(function(c){ return q.indexOf(c)<0; });
      var byRule = named().filter(function(c){ return cum12(c)>=ADV; }).length>=5;
      if(isCut()){
        var drift = cutDrift();
        banner = '<div class="banner ok">Round 3 cut applied: <b>'+q.length+' advancing</b>, '+outs.length+
          ' eliminated. Round 3 now lists only the advancing contestants. '+
          esc(q.map(function(c){ return c.name+" ("+cum12(c)+")"; }).join(", "))+
          ' <button class="lbtn" id="btnUncut">Undo the cut</button></div>'+
          (drift ? '<div class="banner warn">A mark has changed since the cut was announced. The rule would now advance '+
            (drift.added.length ? esc(drift.added.map(nameOf).join(", "))+' as well' : '')+
            (drift.added.length && drift.dropped.length ? ', and drop ' : '')+
            (drift.dropped.length ? esc(drift.dropped.map(nameOf).join(", ")) : '')+
            '. The announced cut stands until you undo and re-apply it.</div>' : '');
      } else {
        banner = '<div class="banner info">Advancing to Round 3: <b>'+q.length+'</b> — '+
          (byRule ? 'everyone with a cumulative score of at least '+ADV+'.'
                  : 'fewer than five reached '+ADV+' points, so the top five carry over, including everyone tied at the fifth spot.')+
          ' '+esc(q.map(function(c){ return c.name+" ("+cum12(c)+")"; }).join(", "))+
          ' <button class="lbtn go" id="btnCut">Apply the cut — eliminate '+outs.length+'</button></div>';
      }
    }
    if(k==="r3"){
      banner = isCut()
        ? '<div class="banner ok">The cut is applied — these <b>'+qual.length+' contestants</b> are Round 3. '+
          'The eliminated are off the list. <button class="lbtn" id="btnUncut">Undo the cut</button></div>'
        : (hasMarks("r2")
          ? '<div class="banner info"><b>'+qual.length+' contestants</b> qualified for this round. The rest are locked out of the tally below. '+
            'Apply the cut on the Round 2 tab to take them off the list entirely.</div>'
          : '<div class="banner warn">Round 2 has no marks yet, so qualification is provisional. Tally Round 2 first.</div>');
    }

    return '<div class="panel">'+
      '<div class="panel-head"><h3>'+LABEL[k]+'</h3><span class="note">'+PTS[k]+' point'+(PTS[k]===1?"":"s")+
      ' per correct answer · 10 questions</span><div class="right">'+
      '<button class="lbtn" data-cue="round" data-round="'+k+'">Put this round on screen</button>'+
      '<button class="lbtn danger" data-clear="'+k+'">Clear this round</button></div></div>'+
      leadersLine(k, list)+banner+
      '<div class="scroll"><table><thead><tr><th class="c">No.</th><th>Name</th><th>School</th>'+
      qHead(QN)+'<th class="c sep">Total</th>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="legend">Click a box for a correct answer. Blank counts as wrong or no answer. Arrow keys move, space toggles. Rows stay in contestant-number order while you tally \u2014 nothing reorders under your cursor. The leader line above and the Top 3 strip update as you click.</div></div>';
  }

  function renderSd(){
    var u = consoleTies();
    var settled = (state.sdAck||[]);
    var head = '<div class="panel-head"><h3>Tie-break</h3><span class="note">Sudden death · '+
      state.meta.sdCount+' questions · a wrong answer eliminates</span>'+
      '<div class="right"><button class="lbtn" data-cue="tiebreak">Put on screen</button>'+
      '<button class="lbtn danger" data-clear="sd">Clear tie-break</button></div></div>';

    if(!u){
      var done = settled.map(function(a){
        return '<div class="banner ok"><b>'+esc(a.name)+'</b> took place '+a.place+
          ' on sudden death. The marks are on record and the standings reflect them. '+
          '<button class="lbtn" data-reopen="'+esc(a.sig)+'">Show the marks again</button></div>';
      }).join("");
      var msg = settled.length
        ? "Nothing left to break."
        : (hasMarks("r3")
          ? "No tie among the top three. Round 1 and Round 2 scores already separated everyone."
          : "Nothing to break yet. Ties are detected automatically once Round 3 is tallied.");
      return '<div class="panel">'+head+done+'<div class="empty-state"><p>'+msg+'</p></div></div>';
    }

    var blocks = u.map(function(g){
      var rows = g.members.map(function(c){
        var idx = state.contestants.indexOf(c), s = sdStreak(c), cells="";
        for(var i=0;i<state.meta.sdCount;i++){
          var v = c.sd[i];
          var locked = !s.alive && i>=s.out;
          cells += '<td class="q"><button class="qbtn'+(v==="c"?" on":(v==="w"?" wrong":""))+'" data-i="'+idx+
            '" data-sd="'+i+'"'+(locked?" disabled":"")+' aria-label="Sudden death question '+(i+1)+', '+
            esc(c.name)+'">'+(v==="c"?"✓":(v==="w"?"✗":""))+'</button></td>';
        }
        return '<tr><td class="no pad">'+c.no+'</td><td class="nm pad">'+esc(c.name)+'</td>'+
          '<td class="sch pad">'+esc(c.school||"—")+'</td>'+cells+
          '<td class="st">'+(s.alive
            ? '<span class="pill alive">'+(s.n?"in play · "+s.n+" correct":"in play")+'</span>'
            : '<span class="pill dead">out at Q'+s.out+'</span>')+'</td></tr>';
      }).join("");

      var sd = sdState(g), alive = sd.alive;
      var status;
      if(!sd.started) status = '<div class="banner info">Ask the '+state.meta.sdCount+
        ' tie-break questions to these '+g.members.length+' contestants at the same time.</div>';
      else if(sd.decided) status = '<div class="banner ok"><b>'+esc(alive[0].name)+'</b> takes place '+g.place+
        ' — the rest are eliminated. The placings above already reflect this.</div>';
      else if(alive.length===0) status = '<div class="banner warn">Everyone was eliminated on the same question. Refer to the Board of Judges.</div>';
      else if(sd.done) status = '<div class="banner warn">'+alive.length+' contestants survived all '+
        state.meta.sdCount+' questions. The Board of Judges decides how to proceed.</div>';
      else status = '<div class="banner info">'+alive.length+' still in play — keep going.</div>';

      return '<div class="panel"><div class="panel-head"><h3>Tie for place '+g.place+'</h3>'+
        '<span class="note">'+g.members.length+' contestants · '+grand(g.members[0])+' points each</span></div>'+
        status+'<div class="scroll"><table><thead><tr><th class="c">No.</th><th>Name</th><th>School</th>'+
        qHead(state.meta.sdCount)+'<th class="c sep">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }).join("");

    return '<div class="panel">'+head+
      '<div class="banner info">Round 1 and Round 2 scores are applied first and did not separate these contestants. '+
      'Click once for a correct answer, twice for a wrong one — an eliminated contestant\u2019s remaining boxes lock.</div></div>'+
      blocks;
  }

  function renderStandings(){
    var s = standings();
    if(!s.rows.length){
      return '<div class="panel"><div class="empty-state"><p>No contestants yet.</p>'+
        '<button class="lbtn go" data-goto="roster">Go to roster</button></div></div>';
    }
    var q = hasMarks("r2") ? qualifiers() : [];
    var rows = s.rows.map(function(c){
      var p = s.place.get(c);
      var cls = p===1?"top top1":(p<=3?"top":"");
      return '<tr class="'+cls+'"><td class="rank"><span class="r">'+p+'</span></td>'+
        '<td class="nm pad">'+esc(c.name)+'</td><td class="sch pad">'+esc(c.school||"—")+'</td>'+
        '<td class="cum">'+rt(c,"r1")+'</td><td class="cum">'+rt(c,"r2")+'</td>'+
        '<td class="cum sep">'+cum12(c)+'</td><td class="cum">'+rt(c,"r3")+'</td>'+
        '<td class="tot">'+grand(c)+'</td>'+
        '<td class="st">'+(q.indexOf(c)>=0?'<span class="pill qual">Round 3</span>':'—')+'</td></tr>';
    }).join("");
    var u = pendingTies();
    return '<div class="panel"><div class="panel-head"><h3>Standings</h3>'+
      '<span class="note">'+s.stage.label+'</span>'+
      '<div class="right"><button class="lbtn" data-cue="leaderboard">Put on screen</button>'+
      '<button class="lbtn" id="btnCsv">Plain CSV</button>'+
      '<button class="lbtn" id="btnPrint">Print</button></div></div>'+
      (u?'<div class="banner warn">A tie in the top three is still open. Go to the Tie-break tab.</div>'
        :(s.stage.s==="r3"?'<div class="banner ok">Top three settled. These three represent '+esc(state.meta.place)+' at the Regional Championship.</div>':''))+
      '<div class="scroll"><table><thead><tr><th class="c">Place</th><th>Name</th><th>School</th>'+
      '<th class="c">R1</th><th class="c">R2</th><th class="c sep">R1 &amp; 2</th><th class="c">R3</th>'+
      '<th class="c sep">Total</th><th class="c">Qualified</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="legend">Places follow Section D.2: cumulative score, then Round 1, then Round 2, then sudden death.</div></div>';
  }


  /* ===================== running the deck =====================
     Everything else in this board happens at human speed: the operator clicks and
     the screen repaints. A clock does not. Repainting the whole audience scene ten
     times a second to move one digit would rebuild the DOM ten times a second and
     cancel every animation mid-flight, so the clock has a path of its own —
     writeClock() puts one string into one cached node, in each document, and only
     when the displayed second actually changes. Nothing else knows it exists. */

  var ask = {
    slide:  0,
    phase:  "off",     // off | armed | running | paused | timeup
    endsAt: null,      // ms timestamp, only while running
    remain: 0          // ms left, meaningful when armed, paused or timed out
  };
  var chimeOn = true;

  function runLive(){ return ask.phase !== "off" && hasDeck(); }
  function curSlide(){ return slides()[ask.slide] || null; }
  function isQuestionSlide(){
    var s = curSlide();
    return !!(s && s.role === "question");
  }

  /* The clock is a deadline, never a countdown that ticks down. A setInterval
     that decrements drifts, and a fifteen-second question that really ran
     seventeen seconds is a protest waiting to happen — with this board as the
     thing the protest is argued against. */
  function remaining(){
    if(ask.phase === "running") return Math.max(0, ask.endsAt - Date.now());
    return ask.remain;
  }
  function fullMs(){
    var s = curSlide();
    return ((s && s.seconds) || DEFAULT_SECONDS) * 1000;
  }
  function fmtClock(sec){
    if(sec < 60) return String(sec);
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  /* ---- moving about ---- */

  function armSlide(){
    ask.phase = "armed";
    ask.endsAt = null;
    ask.remain = isQuestionSlide() ? fullMs() : 0;
    stopTicking();
  }
  function runEnter(i){
    if(!hasDeck()){ toast("Import the slides first"); return; }
    ask.slide = Math.max(0, Math.min(slides().length - 1, i == null ? ask.slide : i));
    armSlide();
    render();
  }
  function runLeave(){
    ask.phase = "off";
    stopTicking();
    render();
    toast("Back to the cues — the deck is off the screen");
  }
  function runStep(d){
    // While the clock runs the next slide is the answer to the question on
    // screen. Showing it early is exactly the accident that invalidates a
    // question, and the Board's decision on that is final.
    if(ask.phase === "running"){ toast("Stop the clock first — the answer is the next slide"); return; }
    var to = ask.slide + d;
    if(to < 0 || to >= slides().length) return;
    ask.slide = to;
    armSlide();
    render();
  }

  /* ---- the clock ---- */

  function runGo(){
    if(!isQuestionSlide()){ toast("This slide has no clock — tag it as a question first"); return; }
    if(ask.phase === "running") return;
    if(ask.phase === "timeup") ask.remain = fullMs();
    if(!ask.remain) ask.remain = fullMs();
    ask.endsAt = Date.now() + ask.remain;
    ask.phase = "running";
    render();
    startTicking();
  }
  function runPause(){
    if(ask.phase !== "running") return;
    ask.remain = remaining();
    ask.endsAt = null;
    ask.phase = "paused";
    stopTicking();
    render();
  }
  function runToggle(){
    if(ask.phase === "running") runPause();
    else runGo();
  }
  // the Quizmaster calls TIME before the deadline
  function runTime(){
    if(ask.phase !== "running" && ask.phase !== "paused") return;
    timeUp();
  }
  function runReset(){
    if(!isQuestionSlide()) return;
    armSlide();
    render();
    toast("Clock reset to " + Math.round(fullMs() / 1000) + " seconds");
  }
  function timeUp(){
    ask.phase = "timeup";
    ask.remain = 0;
    ask.endsAt = null;
    stopTicking();
    render();
    chime();
  }

  /* ---- the live region ---- */

  var tickHandle = null;
  var shownSec = null;          // what is currently written, so we write once a second

  function clockNodes(){
    var out = [], el = $("clockFace");
    if(el) out.push(el);
    if(winRef && !winRef.closed){
      try{
        var w = winRef.document.getElementById("clockFace");
        if(w) out.push(w);
      }catch(err){}
    }
    return out;
  }
  /* The last seconds turn the clock red. That state has to be set here rather
     than at render time: between starting the clock and the deadline there is no
     repaint at all, which is the whole point of the live region. */
  function writeClock(sec){
    var text = fmtClock(sec);
    var low = ask.phase === "running" && sec <= 5;
    clockNodes().forEach(function(el){
      el.textContent = text;
      var box = el.parentNode;
      if(box && box.classList) box.classList.toggle("low", low);
    });
  }
  /* A timer, not an animation. requestAnimationFrame would be the tidier choice
     for something that paints, but the browser throttles it hard the moment this
     window stops being the focused one — and the operator clicks the audience
     window all the time. The clock would freeze and TIME IS UP would arrive late.
     An interval keeps running; at 100ms it costs nothing, and the deadline
     arithmetic means a throttled tick loses accuracy in the display for a moment,
     never in the time actually allowed. */
  function tickOnce(){
    // a break, when there is one, is the clock on screen
    if(brk.on){
      var bms = brkRemaining(), bsec = Math.ceil(bms / 1000);
      if(bsec !== shownSec){ shownSec = bsec; writeBreakClock(bsec); }
      if(brk.running && bms <= 0) breakDone();
      return;
    }
    var ms = remaining(), sec = Math.ceil(ms / 1000);
    if(sec !== shownSec){ shownSec = sec; writeClock(sec); }
    if(ask.phase === "running" && ms <= 0) timeUp();
  }
  function startTicking(){
    if(tickHandle !== null) return;
    shownSec = null;
    tickHandle = window.setInterval(tickOnce, 100);
    tickOnce();
  }
  function stopTicking(){
    if(tickHandle !== null) window.clearInterval(tickHandle);
    tickHandle = null;
    shownSec = null;
  }

  /* The Timekeeper signals the end of the time allowed, so a sound at zero is
     faithful rather than decorative. Built from an oscillator: no asset, nothing
     to load, still one file. */
  var audio = null;
  function chime(){
    if(!chimeOn) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audio = audio || new AC();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;
      [[880, 0], [660, 0.24]].forEach(function(p){
        var osc = audio.createOscillator(), gain = audio.createGain(), at = t0 + p[1];
        osc.type = "square";
        osc.frequency.setValueAtTime(p[0], at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.22, at + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.21);
        osc.connect(gain); gain.connect(audio.destination);
        osc.start(at); osc.stop(at + 0.23);
      });
    }catch(err){}                 // a venue with no audio device is not an error
  }

  /* ---- the audience scene ----
     The slide is the content, so the board's own chrome gets out of its way:
     no header, no skyline, nothing of ours over the RTC's artwork. */
  function runSceneHTML(){
    var s = curSlide();
    if(!s) return '<div class="dsp run"><div class="none">No slide</div></div>';
    var q = s.role === "question";
    var sec = Math.ceil(remaining() / 1000);
    var low = q && ask.phase === "running" && sec <= 5;
    shownSec = null;              // the markup below carries the value; start fresh
    return '<div class="dsp run">' +
      '<img class="slideimg" src="' + s.image + '" alt="">' +
      (q ? '<div class="clock' + (low ? " low" : "") + (ask.phase === "timeup" ? " done" : "") + '">' +
           '<span id="clockFace">' + fmtClock(sec) + '</span>' +
           '<em>' + (ask.phase === "running" ? "seconds left"
                   : (ask.phase === "paused" ? "paused"
                   : (ask.phase === "timeup" ? "time is up" : "seconds"))) + '</em></div>' : '') +
      (ask.phase === "timeup" ? '<div class="timeup">TIME IS UP</div>' : '') +
      '</div>';
  }

  /* ---- the operator's controls, on the display desk ---- */
  function runDeskRow(){
    if(!hasDeck()) return "";
    var s = curSlide(), n = slides().length;
    var q = isQuestionSlide();
    var where = "Slide " + (ask.slide + 1) + " of " + n + " · " + qDesc(ask.slide) +
      (q ? " · " + (s.seconds || DEFAULT_SECONDS) + "s" : "");

    var live = runLive();
    return '<div class="deskrow"><span class="lab">Deck</span>' +
      '<button class="lbtn' + (live ? " on" : " go") + '" id="btnRunEnter">' +
        (live ? "Deck is on screen" : "Put the deck on screen") + '</button>' +
      (live ? '<button class="lbtn" id="btnRunLeave">Back to the cues</button>' : '') +
      '<span class="note">' + esc(where) + '</span></div>' +
      (live
        ? '<div class="deskrow"><span class="lab">Slide</span>' +
            '<button class="lbtn" id="btnRunPrev"' + (ask.slide === 0 ? " disabled" : "") + '>◀ Previous</button>' +
            '<button class="lbtn" id="btnRunNext"' + (ask.slide >= n - 1 ? " disabled" : "") + '>Next ▶</button>' +
            '<span class="lab" style="margin-left:14px">Clock</span>' +
            '<button class="lbtn ' + (ask.phase === "running" ? "" : "go") + '" id="btnRunGo"' +
              (q ? "" : " disabled") + '>' +
              (ask.phase === "running" ? "Pause" : (ask.phase === "paused" ? "Resume" : "Start")) + '</button>' +
            '<button class="lbtn" id="btnRunTime"' +
              (ask.phase === "running" || ask.phase === "paused" ? "" : " disabled") + '>Call TIME</button>' +
            '<button class="lbtn" id="btnRunReset"' + (q ? "" : " disabled") + '>Reset</button>' +
            '<button class="lbtn' + (chimeOn ? " on" : "") + '" id="btnChime">Chime</button>' +
            '<span class="note">' +
              (ask.phase === "running" ? "The next slide is locked while the clock runs — it is the answer."
               : "Space starts and pauses the clock, ← → step the slides, Enter calls TIME, Esc leaves the deck.") +
            '</span></div>'
        : "");
  }

  /* ---- the Run tab ----
     The operator's home during the contest: the slide they are on, the clock,
     and the one column of the tally that this question needs — the same boxes
     the round grids write to, narrowed to the question on screen. */

  /* Which question the tally should show. An answer slide counts as its own
     question's, because that is when the Quizmaster reads each contestant's
     answer out and the ticking actually happens. */
  function runQuestionAt(){
    var i = ask.slide, s = slides()[i];
    if(!s) return null;
    if(s.role === "answer"){
      for(var j = i - 1; j >= 0; j--){
        var p = slides()[j];
        if(p.role === "question") return {s:p, i:j};
        if(p.role === "answer") return null;    // two answers running: ambiguous
      }
      return null;
    }
    return s.role === "question" ? {s:s, i:i} : null;
  }
  function runTallyTarget(){
    var at = runQuestionAt();
    if(!at || !at.s.round) return null;
    var q = qIndexOf(at.i);
    // the trial has no boxes, so this is where it stops short of the tally
    if(!q || q > boxesFor(at.s.round)) return null;
    return {round:at.s.round, q:q, idx:q - 1, slide:at.i};
  }
  function trialNow(){
    var at = runQuestionAt();
    return !!(at && at.s.round === "trial");
  }
  // how a slide reads in the console. The trial's one question needs no number.
  function qDesc(i){
    var s = slides()[i];
    if(!s) return "—";
    if(s.role === "answer") return "answer";
    if(s.role !== "question") return "not a question";
    return s.round === "trial" ? "Trial question"
      : (roundName(s.round || "") + " question " + qIndexOf(i));
  }

  // who is answering: everyone, the announced cut in Round 3, the tied group in
  // sudden death — the same rule the round grids follow
  function runAnswerers(round){
    if(round === "sd"){
      var out = [], p = pendingTies() || [];
      p.forEach(function(g){
        g.members.forEach(function(c){ if(out.indexOf(c) < 0) out.push(c); });
      });
      return out;
    }
    return roundList(round).slice().sort(function(a, b){ return a.no - b.no; });
  }

  function runMarkOf(c, t){
    return t.round === "sd" ? c.sd[t.idx] : !!c[t.round][t.idx];
  }
  function runToggleTick(ci){
    var t = runTallyTarget(), c = state.contestants[ci];
    if(!t || !c) return;
    if(t.round === "sd"){
      var v = c.sd[t.idx];
      var was = sigsNow();
      c.sd[t.idx] = (v === null || v === undefined) ? "c" : (v === "c" ? "w" : null);
      if(c.sd[t.idx] === "w"){
        for(var z = t.idx + 1; z < state.meta.sdCount; z++) c.sd[z] = null;
      }
      checkSdResolved(was);
    } else {
      c[t.round][t.idx] = !c[t.round][t.idx];
    }
    render();
    var el = document.querySelector('.rtick[data-rtick="' + ci + '"]');
    if(el) el.focus();
  }
  function runClearQuestion(){
    var t = runTallyTarget();
    if(!t) return;
    if(!confirm("Clear every mark for " + roundName(t.round) + " question " + t.q + "?")) return;
    runAnswerers(t.round).forEach(function(c){
      if(t.round === "sd") c.sd[t.idx] = null;
      else c[t.round][t.idx] = false;
    });
    render();
    toast("Cleared question " + t.q);
  }

  function renderRun(){
    if(!hasDeck()){
      return '<div class="panel"><div class="panel-head"><h3>Run</h3></div>' +
        '<div class="empty-state"><p>No deck loaded. This tab drives the slides and tallies ' +
        'the question on screen.</p><button class="lbtn go" data-goto="deck">Go to the deck</button>' +
        '</div></div>';
    }
    var s = curSlide(), t = runTallyTarget(), live = runLive(), n = slides().length;
    var what = qDesc(ask.slide);

    var head = '<div class="panel-head"><h3>Run</h3>' +
      '<span class="note">Slide ' + (ask.slide + 1) + ' of ' + n + ' · ' + esc(what) +
      (s && s.role === "question" ? ' · ' + (s.seconds || DEFAULT_SECONDS) + 's' : '') + '</span>' +
      '<div class="right">' +
        (live ? '<button class="lbtn" id="btnRunLeave">Back to the cues</button>'
              : '<button class="lbtn go" id="btnRunEnter">Put the deck on screen</button>') +
      '</div></div>';

    var isQ = !!(s && s.role === "question");
    var sec = live ? Math.ceil(remaining() / 1000) : Math.round(fullMs() / 1000);
    var clockCls = ask.phase === "timeup" ? " done"
      : ((sec <= 5 && ask.phase === "running") ? " low" : "");
    var stage = '<div class="runstage">' +
      '<div class="runslide">' + (s ? '<img src="' + s.image + '" alt="">' : '') + '</div>' +
      '<div class="runside">' +
        (isQ
          ? '<div class="runclock' + clockCls + '">' + fmtClock(sec) + '<em>' +
            (!live ? "not on screen"
             : (ask.phase === "running" ? "seconds left"
             : (ask.phase === "paused" ? "paused"
             : (ask.phase === "timeup" ? "time is up" : "seconds")))) + '</em></div>'
          : '<div class="runclock off">—<em>no clock</em></div>') +
        '<div class="runbtns">' +
          '<button class="lbtn" id="btnRunPrev"' + (ask.slide === 0 ? " disabled" : "") + '>◀ Previous</button>' +
          '<button class="lbtn" id="btnRunNext"' + (ask.slide >= n - 1 ? " disabled" : "") + '>Next ▶</button>' +
          '<button class="lbtn ' + (ask.phase === "running" ? "" : "go") + '" id="btnRunGo"' +
            (isQ && live ? "" : " disabled") + '>' +
            (ask.phase === "running" ? "Pause" : (ask.phase === "paused" ? "Resume" : "Start clock")) + '</button>' +
          '<button class="lbtn" id="btnRunTime"' +
            (ask.phase === "running" || ask.phase === "paused" ? "" : " disabled") + '>Call TIME</button>' +
          '<button class="lbtn" id="btnRunReset"' + (isQ ? "" : " disabled") + '>Reset</button>' +
        '</div>' +
      '</div></div>';

    // the questions of this round, as a strip you can jump about in
    var strip = "";
    if(t){
      var total = qSlides(t.round).length, who0 = runAnswerers(t.round), dots = [];
      for(var k = 1; k <= total; k++){
        var idx = k - 1;
        var anyMark = who0.some(function(c){
          return t.round === "sd" ? c.sd[idx] : c[t.round][idx];
        });
        dots.push('<button class="qdot' + (k === t.q ? " on" : "") + (anyMark ? " done" : "") +
          '" data-rjump="' + k + '">' + k + '</button>');
      }
      strip = '<div class="qstrip"><span class="lab">' + esc(roundName(t.round)) + '</span>' +
        dots.join("") + '<span class="note">Jump to any question of this round.</span></div>';
    }

    var tally;
    if(!t){
      tally = '<div class="empty-state"><p>' + (trialNow()
        ? 'The trial question is not scored. It is given before Round 1 so everyone can practise ' +
          'answering — the clock runs as usual, and nothing here reaches the tally sheet.'
        : 'This slide is not a question, so there is nothing to tally. ' +
          'Step to a question slide, or tag this one on the Deck tab.') + '</p></div>';
    } else {
      var who = runAnswerers(t.round);
      if(!who.length){
        tally = '<div class="empty-state"><p>' + (t.round === "sd"
          ? "No tie-break is open, so nobody is answering these."
          : "No contestants on the roster yet.") + '</p></div>';
      } else {
        var ticked = who.filter(function(c){ return runMarkOf(c, t); }).length;
        var rows = who.map(function(c){
          var v = runMarkOf(c, t), ci = state.contestants.indexOf(c);
          var cls = t.round === "sd" ? (v === "c" ? " on" : (v === "w" ? " wrong" : ""))
                                     : (v ? " on" : "");
          var mark = t.round === "sd" ? (v === "c" ? "✓" : (v === "w" ? "✗" : ""))
                                      : (v ? "✓" : "");
          return '<tr><td class="no pad">' + c.no + '</td>' +
            '<td class="nm pad">' + esc(c.name) + '</td>' +
            '<td class="sch pad">' + esc(c.school || "—") + '</td>' +
            '<td class="q"><button class="rtick' + cls + '" data-rtick="' + ci +
              '" aria-pressed="' + (cls ? "true" : "false") +
              '" aria-label="' + esc(c.name) + '">' + mark + '</button></td></tr>';
        }).join("");
        tally = '<div class="panel-head tallyhead">' +
          '<h3>' + esc(roundName(t.round)) + ' · question ' + t.q + '</h3>' +
          '<span class="note">' + ticked + ' of ' + who.length + ' marked' +
          (t.round === "sd" ? " · click once for correct, twice for wrong" : " correct") + '</span>' +
          '<div class="right"><button class="lbtn danger" id="btnRunClearQ">Clear this question</button>' +
          '</div></div>' +
          '<div class="scroll"><table><thead><tr><th class="c">No.</th><th>Name</th><th>School</th>' +
          '<th class="c">Correct</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }
    }

    return '<div class="panel">' + head + stage +
      '<div class="desk" style="padding:0 15px 4px">' + progRow() + breakRow() + '</div>' + strip + tally +
      '<div class="legend">These are the same boxes the round tabs hold — this is one column of them, ' +
      'for the question on screen. An answer slide tallies its own question, which is when the Quizmaster ' +
      'reads the answers out. While a tally button has focus the arrows and space belong to the tally, ' +
      'not to the deck.</div></div>';
  }

  /* ---- the health break ----
     Between rounds the contest stops and the audience needs telling for how long.
     It is a clock like any other here: a deadline, not a countdown that ticks
     down, sharing the same one-write-a-second live region as the question clock.

     It sits above everything on screen — above the deck, above the cues — because
     a break interrupts whatever was showing. And starting one pauses a running
     question clock, which is the part that would otherwise go wrong quietly: a
     fifteen-second question does not survive a ten-minute break running underneath
     it. */

  var brk = {on:false, running:false, endsAt:null, remain:0, minutes:10};
  var BREAK_MINUTES = [5, 10, 15, 20, 30];

  function brkRemaining(){
    if(brk.running) return Math.max(0, brk.endsAt - Date.now());
    return brk.remain;
  }
  function fmtMS(sec){
    var m = Math.floor(Math.max(0, sec) / 60), r = Math.max(0, sec) % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function hhmm(d){
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function startBreak(mins){
    if(mins) brk.minutes = mins;
    var m = Math.max(1, Math.min(180, Math.round(brk.minutes || 10)));
    brk.minutes = m;
    // a question clock must not run on underneath the break
    if(ask.phase === "running") runPause();
    brk.on = true;
    brk.remain = m * 60000;
    brk.endsAt = Date.now() + brk.remain;
    brk.running = true;
    render();
    startTicking();
    toast("Health break — " + m + " minute" + (m === 1 ? "" : "s"));
  }
  function pauseBreak(){
    if(!brk.on || !brk.running) return;
    brk.remain = brkRemaining();
    brk.endsAt = null;
    brk.running = false;
    stopTicking();
    render();
  }
  function resumeBreak(){
    if(!brk.on || brk.running) return;
    brk.endsAt = Date.now() + Math.max(0, brk.remain);
    brk.running = true;
    render();
    startTicking();
  }
  function toggleBreak(){ if(brk.running) pauseBreak(); else resumeBreak(); }
  function addBreakTime(mins){
    if(!brk.on) return;
    var add = mins * 60000;
    if(brk.running) brk.endsAt = Math.max(Date.now(), brk.endsAt || Date.now()) + add;
    else brk.remain = Math.max(0, brk.remain) + add;
    render();
    toast((mins > 0 ? "Added " : "Took off ") + Math.abs(mins) + " minute" +
          (Math.abs(mins) === 1 ? "" : "s"));
  }
  function endBreak(){
    if(!brk.on) return;
    brk.on = false; brk.running = false; brk.endsAt = null; brk.remain = 0;
    stopTicking();
    render();
    toast("Break over — back to the screen you left");
  }
  // the time ran out; the operator still decides when to resume
  function breakDone(){
    brk.running = false; brk.remain = 0; brk.endsAt = null;
    stopTicking();
    render();
    chime();
  }

  function writeBreakClock(sec){
    var text = fmtMS(sec), soon = brk.running && sec <= 30;
    clockNodes().forEach(function(el){
      el.textContent = text;
      var box = el.parentNode;
      if(box && box.classList) box.classList.toggle("soon", soon);
    });
  }

  function breakSceneHTML(){
    var sec = Math.ceil(brkRemaining() / 1000);
    var over = sec <= 0;
    shownSec = null;                     // the markup carries the value; start fresh
    var sub = over ? "We resume in a moment"
      : (brk.running ? "We resume at " + hhmm(new Date(brk.endsAt)) : "Paused");
    return '<div class="dsp">' + dspHead("Health break") +
      '<div class="body"><div class="brk' + (over ? " over" : "") + '">' +
      '<div class="kick">Health break</div>' +
      '<div class="bclock"><span id="clockFace">' + fmtMS(sec) + '</span></div>' +
      '<div class="bsub">' + esc(sub) + '</div>' +
      '</div></div></div>';
  }

  /* The same controls on the Display desk and on the Run tab, because the
     operator may be on either when the Quizmaster calls the break. */
  function breakRow(){
    if(!brk.on){
      return '<div class="deskrow"><span class="lab">Health break</span>' +
        BREAK_MINUTES.map(function(m){
          return '<button class="lbtn' + (brk.minutes === m ? " on" : "") +
            '" data-brkmin="' + m + '">' + m + '</button>';
        }).join("") +
        '<input class="bmin" id="brkMin" type="number" min="1" max="180" step="1" value="' +
          esc(String(brk.minutes)) + '" aria-label="Minutes for the health break"><span class="unit">min</span>' +
        '<button class="lbtn go" id="btnBreakStart">Start the break</button>' +
        '<span class="note">Takes the screen while it runs, and pauses a question clock if one is going.</span>' +
        '</div>';
    }
    var sec = Math.ceil(brkRemaining() / 1000);
    return '<div class="deskrow"><span class="lab">Health break</span>' +
      '<b class="brkleft' + (sec <= 30 && brk.running ? " soon" : "") + '">' + fmtMS(sec) + '</b>' +
      '<button class="lbtn ' + (brk.running ? "" : "go") + '" id="btnBreakToggle">' +
        (brk.running ? "Pause" : "Resume") + '</button>' +
      '<button class="lbtn" data-brkadd="1">+1 min</button>' +
      '<button class="lbtn" data-brkadd="5">+5 min</button>' +
      '<button class="lbtn danger" id="btnBreakEnd">End the break</button>' +
      '<span class="note">' + (sec <= 0
        ? "The time is up — end the break when the Quizmaster is ready."
        : "The screen goes back to whatever it was showing when you end it.") + '</span></div>';
  }
  /* ===================== display control desk ===================== */
  /* The key is written down rather than taken from the position, so a cue can
     be added or dropped without the whole keypad shifting under the operator —
     which is also why the two newest carry a letter: the digits were spoken for
     and renumbering would have moved every cue the operator already knows. */
  var CUES = [
    {id:"standby",     k:"1", t:"Title card",        d:"Event name, province, date"},
    {id:"mechanics",   k:"2", t:"Contest mechanics", d:"The rounds, qualifying, and tie-breaks"},
    {id:"programme",   k:"P", t:"The programme",     d:"The whole run of show, the segment on now marked"},
    {id:"segment",     k:"S", t:"This segment",      d:"The segment on now, and whoever is taking it"},
    {id:"introduce",   k:"3", t:"Introduce contestants", d:"School by school, each followed by their coach"},
    {id:"judges",      k:"4", t:"Board of Judges",   d:"One judge to a screen, in the order you set"},
    {id:"round",       k:"5", t:"Round scores",      d:"By contestant number, for the read-out"},
    {id:"advancing",   k:"6", t:"Advancing to R3",   d:"Who made the cut after Round 2"},
    {id:"leaderboard", k:"7", t:"Leaderboard",       d:"Ranked, current standings"},
    {id:"tiebreak",    k:"8", t:"Sudden death",      d:"Live tie-break marks"},
    {id:"reveal",      k:"9", t:"2nd & 3rd placers", d:"Third, then second — champion is separate"},
    {id:"champion",    k:"",  t:"Champion card",     d:"Full-screen winner, reached by R"},
    {id:"blank",       k:"0", t:"Blank the screen",  d:"Holding slate between segments"}
  ];
  function cueName(id){ var c=CUES.filter(function(x){return x.id===id;})[0]; return c?c.t:id; }

  function renderDesk(){
    var open = !!(winRef && !winRef.closed);
    var cues = CUES.map(function(c){
      return '<button class="cue'+(disp.cue===c.id?" on":"")+'" data-cue="'+c.id+'">'+
        '<b>'+(c.k?'<i class="k">'+c.k+'</i>':'')+c.t+'</b><span>'+c.d+'</span></button>';
    }).join("");
    var rounds = ["r1","r2","r3"].map(function(k){
      return '<button class="lbtn'+(disp.round===k?" on":"")+'" data-cue="round" data-round="'+k+'">'+LABEL[k]+'</button>';
    }).join("");
    var pl = pagedList();
    var pages = pl ? Math.max(1, Math.ceil(pl.length/per())) : 1;
    var mech = disp.cue==="mechanics";
    var intro = disp.cue==="introduce";
    var jud = disp.cue==="judges";
    var prg = disp.cue==="programme" || disp.cue==="segment";
    var photos = named().filter(function(c){ return isPhoto(c.photo); }).length;
    var rev = [["Reveal 3rd placer",1],["Reveal 2nd placer",2]].map(function(r){
      return '<button class="lbtn'+(disp.cue==="reveal" && disp.reveal===r[1]?" on":"")+'" data-reveal="'+r[1]+'">'+r[0]+'</button>';
    }).join("");

    var need = unassigned();
    var coachRow = need.length
      ? '<div class="deskrow"><span class="lab">Coaches</span>'+
        '<button class="lbtn" data-goto="roster">Choose the missing coaches</button>'+
        '<span class="note">'+need.length+' contestant'+(need.length===1?"":"s")+
        ' come'+(need.length===1?"s":"")+' from a school with more than one coach and none picked \u2014 '+
        'the introduction runs them without a coach screen.</span></div>'
      : "";

    // the Round 3 cut, offered here because the operator is on this tab while the
    // Round 2 scores are on screen and the Quizmaster reads out who advances
    var cutRow = "";
    if(isCut()){
      cutRow = '<div class="deskrow"><span class="lab">Round 3 cut</span>'+
        '<button class="lbtn" id="btnUncut2">Undo the cut</button>'+
        '<span class="note">Applied · '+qualifiers().length+' advancing, '+
        (named().length-qualifiers().length)+' eliminated · Round 2 marks them on screen and Round 3 lists only those advancing.</span></div>';
    } else if(hasMarks("r2")){
      cutRow = '<div class="deskrow"><span class="lab">Round 3 cut</span>'+
        '<button class="lbtn go" id="btnCut2">Apply the cut</button>'+
        '<span class="note">Freezes who advances: '+liveQualifiers().length+' through, '+
        (named().length-liveQualifiers().length)+' eliminated on the Round 2 screen.</span></div>';
    }

    return '<div class="panel"><div class="panel-head"><h3>Display screen</h3>'+
      '<span class="note">'+(open?"Live — showing "+cueName(disp.cue):"Not open yet")+'</span>'+
      '<div class="right">'+

        '<button class="lbtn" id="btnPreview2">Preview here</button>'+

          }).join("")+

        (mech||jud||prg
          ? '<div class="deskrow"><span class="lab">Per page</span>'+

                                         : 'One screen \u2014 the Programme tab sets what is on it.'))+

            (intro?[1,4,6,8]:[6,8,10,12]).map(function(v){
              return '<button class="lbtn'+((intro?introPer:perPage)===v?" on":"")+'" data-per="'+v+'">'+v+'</button>';
            }).join("")+
            (intro?'<span class="note">How many of a school\u2019s contestants share a screen before their '+
                   'coach follows. One introduces them individually.</span>':'')+'</div>')+
        '<div class="deskrow"><span class="lab">Page</span>'+
          '<button class="lbtn" data-pg="-1"'+(!pl||disp.page===0?" disabled":"")+'>\u25c0 Previous</button>'+
          '<button class="lbtn" data-pg="1"'+(!pl||disp.page>=pages-1?" disabled":"")+'>Next \u25b6</button>'+
          '<span class="note">'+(pl
            ? (mech ? (pl.length+" mechanics screens \u00b7 showing screen "+(disp.page+1)+" of "+pages)
              : (jud ? (pl.length+" judge"+(pl.length===1?"":"s")+" \u00b7 one to a screen \u00b7 showing "+
                        (disp.page+1)+" of "+pages)
              : (intro ? (pl.length+" screen"+(pl.length===1?"":"s")+" \u00b7 school by school, each followed "+
                          "by their coach \u00b7 showing "+(disp.page+1)+" of "+pages)
                       : (pl.length+" contestants \u00b7 "+per()+" per page \u00b7 showing page "+
                          (disp.page+1)+" of "+pages))))
            : "This cue is a single screen")+'</span></div>'+
        '<div class="deskrow"><span class="lab">Reveal</span>'+rev+
          '<button class="lbtn" data-reveal="0">Hide both</button>'+

      '</div>'+
      '<div class="legend">Shortcuts: T returns to the title card, M shows the contest mechanics and P shows the programme, from anywhere. '+
      'On this tab, the badge on each cue picks it — a number for most, P for the programme and S for the segment on now — '+
      'left and right arrows turn the page, and R walks the declaration — '+
      '3rd placer, 2nd placer, then the champion’s card.'+
      (photos<named().length ? ' <b>'+(named().length-photos)+' contestants have no photo yet</b> — add them on the Roster tab; the introduction screen shows their number instead.' : '')+
      (namedCoaches().filter(function(k){ return !isPhoto(k.photo); }).length
        ? ' Coaches without a photo show their initials on their screen.' : '')+
